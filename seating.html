<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.__KC_PREFIXES=['sp/','sg/','st/','arrive/','meta/','seating/','invites/'];</script><script>/* Stand-in for the Claude page runtime: the same claude.use('db') / ('downloads') calls,
   backed by the 冠成 Apps Script + Google Sheet, with a shared passcode. */
(()=>{
const API='https://script.google.com/macros/s/AKfycbx4J4jwRwaeZ1l8qbJXbwGf486TUU8jgg4FR1YHfr9CZgAne3XlDPVl-ayJx8q2mGw/exec';
const PREFIXES=window.__KC_PREFIXES||null;
const KEYK='kc37-passcode';
let key=null;try{key=localStorage.getItem(KEYK);}catch(_){}
async function call(body,tries=0){
  let r;try{r=await fetch(API,{method:'POST',body:JSON.stringify({...body,key})});}
  catch(e){if(tries<2){await new Promise(s=>setTimeout(s,1200*(tries+1)));return call(body,tries+1);}const x=new Error('network');x.code='unavailable';throw x;}
  let j;try{j=await r.json();}catch(_){const x=new Error('bad response');x.code='unavailable';throw x;}
  if(!j.ok){const x=new Error(j.error||'error');x.code=j.error==='bad_key'?'invalid_argument':'unavailable';x.badKey=j.error==='bad_key';throw x;}
  return j;
}
window.__kcCall=call;

// ---------- passcode gate ----------
let readyRes;const ready=new Promise(r=>readyRes=r);
function gate(msg){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:16px;background:rgba(30,10,12,.72)';
  d.innerHTML=`<form style="background:#FFFDF9;color:#2E2622;border-radius:18px;border-top:4px solid #7A1520;padding:26px 24px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;box-shadow:0 24px 70px rgba(0,0,0,.4)">
    <div style="font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;letter-spacing:.06em">請輸入通關密碼</div>
    <div style="font-size:15px;color:#5C514A">冠成尾牙內部使用，密碼請向負責同仁索取。這台裝置輸入一次就會記住。</div>
    <input id="kcPass" autocomplete="current-password" type="password" style="font:inherit;font-size:18px;padding:10px 12px;border:1px solid #D9BF8A;border-radius:10px" aria-label="通關密碼">
    <div id="kcErr" style="color:#B5541B;font-size:14px;min-height:1em">${msg||''}</div>
    <button style="font:inherit;font-size:17px;font-weight:700;padding:10px;border:none;border-radius:999px;background:#7A1520;color:#F6E7C8;cursor:pointer">進入</button></form>`;
  document.body.appendChild(d);const f=d.querySelector('form');setTimeout(()=>d.querySelector('input').focus(),0);
  f.onsubmit=async e=>{e.preventDefault();const v=d.querySelector('input').value.trim();if(!v)return;key=v;d.querySelector('#kcErr').textContent='確認中…';
    try{await call({op:'list',since:Date.now()+86400000});try{localStorage.setItem(KEYK,key);}catch(_){}d.remove();readyRes();}
    catch(err){d.querySelector('#kcErr').textContent=err.badKey?'密碼不對，請再確認一次。':'連不上伺服器，請檢查網路後再試。';}};
}
async function start(){
  if(key){try{await call({op:'list',since:Date.now()+86400000});readyRes();return;}catch(e){if(!e.badKey){readyRes();return;}}}
  gate(key?'密碼已變更，請重新輸入。':'');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
window.kcLogout=()=>{try{localStorage.removeItem(KEYK);}catch(_){}location.reload();};

// ---------- document store with polling ----------
const cache=new Map();           // "coll/id" -> data
const colL=new Map(),docL=new Map();
const pend=new Map();            // key -> {json, waiters:[]}
const inflight=new Set();
let since=0,firstDone=false,firstRes;const first=new Promise(r=>firstRes=r);
const depth=p=>p.split('/').length;
const snapOf=(id,v)=>({id,exists:v!==undefined,data:()=>v,metadata:{fromCache:false,hasPendingWrites:false}});
function colSnap(c){const docs=[];cache.forEach((v,k)=>{if(k.startsWith(c+'/')&&depth(k)===depth(c)+1)docs.push(snapOf(k.slice(c.length+1),v));});
  docs.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};}
function emit(keys){const cs=new Set(),ds=new Set();keys.forEach(k=>{ds.add(k);cs.add(k.slice(0,k.lastIndexOf('/')));});
  cs.forEach(c=>(colL.get(c)||[]).forEach(fn=>{try{fn(colSnap(c));}catch(e){console.error(e);}}));
  ds.forEach(d=>(docL.get(d)||[]).forEach(fn=>{try{fn(snapOf(d.split('/').pop(),cache.get(d)));}catch(e){console.error(e);}}));}
async function poll(){
  try{const j=await call({op:'list',since,prefixes:PREFIXES});
    const ch=[];
    j.docs.forEach(d=>{if(pend.has(d.k)||inflight.has(d.k))return;
      if(d.del){if(cache.has(d.k)){cache.delete(d.k);ch.push(d.k);}}
      else{const cur=cache.get(d.k);if(cur===undefined||JSON.stringify(cur)!==d.json){try{cache.set(d.k,JSON.parse(d.json));ch.push(d.k);}catch(_){}}}});
    since=j.now-4000;
    if(!firstDone){firstDone=true;firstRes();colL.forEach((fns,c)=>fns.forEach(fn=>fn(colSnap(c))));docL.forEach((fns,d)=>fns.forEach(fn=>fn(snapOf(d.split('/').pop(),cache.get(d)))));}
    else if(ch.length)emit(ch);
    setStatus('');
  }catch(e){if(e.badKey){gate('密碼已變更，請重新輸入。');return;}setStatus('offline');}
  setTimeout(poll,document.hidden?30000:6000);
}
ready.then(poll);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&firstDone)poll();});
let flushT=null;
function queue(k,json){return new Promise((res,rej)=>{const p=pend.get(k)||{waiters:[]};p.json=json;p.waiters.push({res,rej});pend.set(k,p);clearTimeout(flushT);flushT=setTimeout(flush,250);});}
async function flush(){if(!pend.size)return;const items=[...pend.entries()].slice(0,150);items.forEach(([k])=>{pend.delete(k);inflight.add(k);});
  try{await call({op:'write',writes:items.map(([k,p])=>({k,json:p.json}))});items.forEach(([,p])=>p.waiters.forEach(w=>w.res()));}
  catch(e){items.forEach(([k,p])=>p.waiters.forEach(w=>w.rej(e)));}
  finally{items.forEach(([k])=>inflight.delete(k));if(pend.size)flush();}}
function setOne(k,data){const d=JSON.parse(JSON.stringify(data));cache.set(k,d);emit([k]);return queue(k,JSON.stringify(d));}
function delOne(k){cache.delete(k);emit([k]);return queue(k,null);}
function docRef(path){return{id:path.split('/').pop(),path,
  set:d=>setOne(path,d),
  update:d=>setOne(path,{...(cache.get(path)||{}),...d}),
  delete:()=>delOne(path),
  get:async()=>{await first;return snapOf(path.split('/').pop(),cache.get(path));},
  onSnapshot:(fn)=>{if(!docL.has(path))docL.set(path,[]);docL.get(path).push(fn);if(firstDone)setTimeout(()=>fn(snapOf(path.split('/').pop(),cache.get(path))),0);return()=>{const a=docL.get(path);a.splice(a.indexOf(fn),1);};},
  collection:c=>colRef(path+'/'+c)};}
function colRef(c){return{path:c,doc:id=>docRef(c+'/'+(id||Math.random().toString(36).slice(2,12))),
  add:async d=>{const r=docRef(c+'/'+Math.random().toString(36).slice(2,12));await r.set(d);return r;},
  get:async()=>{await first;return colSnap(c);},
  onSnapshot:(fn)=>{if(!colL.has(c))colL.set(c,[]);colL.get(c).push(fn);if(firstDone)setTimeout(()=>fn(colSnap(c)),0);return()=>{const a=colL.get(c);a.splice(a.indexOf(fn),1);};}};}
const db={doc:docRef,collection:colRef};
window.addEventListener('beforeunload',e=>{if(pend.size||inflight.size){e.preventDefault();e.returnValue='';}});

// ---------- connection badge ----------
let badge=null;
function setStatus(s){if(!badge){badge=document.createElement('div');badge.style.cssText='position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;background:#B5541B;color:#fff;border-radius:999px;padding:6px 14px;font:600 14px "Noto Sans TC",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)';badge.hidden=true;document.body.appendChild(badge);}
  badge.hidden=!s;badge.textContent='⚠️ 網路中斷，恢復後會自動同步';}

// ---------- downloads ----------
const downloads={save:async({filename,data})=>{
  const type=/\.html?$/i.test(filename)?'text/html;charset=utf-8':/\.xlsx$/i.test(filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':/\.json$/i.test(filename)?'application/json':/\.jpe?g$/i.test(filename)?'image/jpeg':'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});const url=URL.createObjectURL(blob);
  if(/\.html?$/i.test(filename)){const w=window.open(url,'_blank');if(w){setTimeout(()=>URL.revokeObjectURL(url),60000);return;}}
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}};

// ---------- back to top ----------
function topBtn(){const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','回到最上面');b.title='回到最上面';
  b.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span style="font-size:12px;font-weight:700;line-height:1">頂部</span>';
  b.style.cssText='position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;width:60px;height:60px;border-radius:50%;border:none;background:#7A1520;color:#F6E7C8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 8px 24px rgba(78,11,19,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(8px);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif';
  b.onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  document.body.appendChild(b);
  const upd=()=>{const on=window.scrollY>500;b.style.opacity=on?'1':'0';b.style.pointerEvents=on?'auto':'none';b.style.transform=on?'none':'translateY(8px)';};
  window.addEventListener('scroll',upd,{passive:true});upd();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',topBtn);else topBtn();

window.claude={use:async n=>{if(n==='db'){await ready;return db;}if(n==='downloads')return downloads;return null;}};
})();
</script></head><body><title>冠成尾牙座位系統</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: toolbar band; left = 未安排名單, right = 會場平面圖 (the real 大中華 layout) / 各桌名單 / 報名統計. Banquet red + gold on a cool floor-plan ground. */
:root{
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E8EAF1; --ink:#1A2033; --muted:#5A6276; --line:#D6DAE4;
  --accent:#A3152A; --accent-ink:#FFFFFF; --gold:#A97A1E; --warn:#C2410C; --ok:#2F7D4F;
  --c-vip:#A3152A; --c-gov:#7A4BB8; --c-edu:#1F6FB2; --c-charity:#C2410C; --c-vendor:#0E7C6B;
  --c-club:#9C6B00; --c-partner:#4E7A1E; --c-family:#B33D86; --c-friend:#8A5A44; --c-staff:#3F4C6B; --c-other:#7A7F8C; --c-guest:#B8860B;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F131D; --surface:#171D2B; --sunk:#1E2638; --ink:#E8EBF3; --muted:#9AA2B6; --line:#2B3550;
  --accent:#E0475B; --accent-ink:#1A0A0D; --gold:#D6A84C; --warn:#F08A4B; --ok:#5DBB86;
  --c-vip:#E0475B; --c-gov:#A98BE6; --c-edu:#5DA8E8; --c-charity:#F08A4B; --c-vendor:#3DBFA8;
  --c-club:#D6A84C; --c-partner:#93C25A; --c-family:#E57DBA; --c-friend:#C99A82; --c-staff:#94A3C8; --c-other:#9AA0AD; --c-guest:#E0B04A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131D; --surface:#171D2B; --sunk:#1E2638; --ink:#E8EBF3; --muted:#9AA2B6; --line:#2B3550;
  --accent:#E0475B; --accent-ink:#1A0A0D; --gold:#D6A84C; --warn:#F08A4B; --ok:#5DBB86;
  --c-vip:#E0475B; --c-gov:#A98BE6; --c-edu:#5DA8E8; --c-charity:#F08A4B; --c-vendor:#3DBFA8;
  --c-club:#D6A84C; --c-partner:#93C25A; --c-family:#E57DBA; --c-friend:#C99A82; --c-staff:#94A3C8; --c-other:#9AA0AD; --c-guest:#E0B04A;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:900;font-size:31px;margin:0;letter-spacing:.04em}
h1 small{display:block;font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:.08em}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.stat b{font-size:22px}.stat span{font-size:14px;color:var(--muted)}
.stat.warn b{color:var(--warn)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
button{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible,.tbl:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.gold{border-color:var(--gold);color:var(--gold);font-weight:700}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 7px}
input[type=number]{width:56px}
textarea{width:100%;min-height:90px;resize:vertical}
label.inl{display:inline-flex;align-items:center;gap:5px;font-size:16px;color:var(--muted)}
.banner{background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:10px;padding:8px 12px;font-size:16px}
.main{display:grid;grid-template-columns:350px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel>h2{font-size:17px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel>h2 button{font-size:14px;padding:2px 9px;font-weight:500}
.pickbar{margin:8px 10px 0;padding:7px 10px;border-radius:8px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid var(--gold);font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pickbar b{font-size:17px;color:var(--accent)}
.panel>h2 .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.pool{padding:8px 10px;display:flex;flex-direction:column;gap:8px;max-height:78vh;overflow:auto;min-height:120px}
.pool.drop{background:var(--sunk)}
.empty{color:var(--muted);font-size:16px;padding:12px 4px}
.grp{display:flex;flex-direction:column;gap:4px;padding:6px 6px 7px;border-radius:8px;border-left:3px solid var(--cc,var(--c-other));background:color-mix(in srgb,var(--cc,var(--c-other)) 6%,transparent)}
.ghead{display:flex;align-items:center;gap:6px;justify-content:space-between}
.gname{border:none;background:none;padding:0;font-weight:700;font-size:16px;text-align:left;white-space:normal;cursor:pointer;color:var(--ink)}
.gname:hover{text-decoration:underline}
.ghead select{font-size:13px;padding:1px 3px;max-width:92px}
.withsel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.withsel select{flex:1;min-width:0;font-size:13px;padding:1px 3px}
.gnote{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 9px;cursor:grab;user-select:none;display:inline-flex;align-items:center;gap:3px}
.chip i{font-style:normal;font-size:12px;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 3px;line-height:1.3}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.sel i{color:var(--bg);border-color:var(--bg)}
.tabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap}
.tabs button{border-radius:7px 7px 0 0;border-bottom:none}
.view{padding:10px}
.venuewrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:14px;align-items:start}
@media (max-width:1560px){.venuewrap{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.planbox{overflow:auto}
.plan.moving .tbl{cursor:move;outline:2px dashed var(--gold);outline-offset:2px}
.plan{position:relative;touch-action:pan-y;width:100%;min-width:560px;max-width:820px;margin:0 auto;aspect-ratio:920/1180;border:1px solid var(--line);border-radius:10px;background-color:var(--sunk);
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:5% 3.9%;overflow:hidden}
.stage{position:absolute;left:19.5%;right:17%;top:4%;height:10.5%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;letter-spacing:.6em;padding-left:.6em;border-radius:6px;font-size:clamp(22px,3.6vw,36px)}
.aisle{position:absolute;left:42.4%;width:15%;top:27.5%;height:55.5%;border:2px dashed color-mix(in srgb,var(--muted) 60%,transparent);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-size:clamp(19px,2.88vw,29px);writing-mode:vertical-rl;letter-spacing:1.2em}
.door{position:absolute;bottom:1.6%;transform:translateX(-50%);font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.door.gate{font-weight:700;color:var(--ink);border-color:var(--gold)}
.pillar{position:absolute;transform:translate(-50%,-50%);width:10.5%;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px}
.tbl{position:absolute;transform:translate(-50%,-50%);width:12.6%;aspect-ratio:1;border-radius:50%;cursor:pointer;display:grid;place-items:center;text-align:center;
  background:conic-gradient(var(--tc) calc(var(--fill)*1turn),color-mix(in srgb,var(--tc) 18%,var(--surface)) 0);padding:5px;border:none}
.tbl .in{width:100%;height:100%;min-width:0;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1.1;padding:4px 7px;position:relative;overflow:hidden}
.tbl{grid-template-columns:100%;grid-template-rows:100%;position:absolute}

<script>
(()=>{
const CATS=[
 {k:'vip',label:'主桌貴賓',re:/主桌|vip/i},
 {k:'gov',label:'政府機關／民代',re:/政府|機關|民代|政商|議員|縣|鎮|警|農會|立委|代表|公所/},
 {k:'guest',label:'貴賓',re:/貴賓/},
 {k:'edu',label:'學校',re:/教育|學校|校長|國小|國中|高中|大學|科大|家長會|校友/},
 {k:'vendor',label:'廠商',re:/廠商|原廠|廠牌|經銷|供應|銀行/},
 {k:'club',label:'社團',re:/扶輪|社團|獅子|山友|同學|EMBA/i},
 {k:'partner',label:'同行',re:/同行|同業|協力|外包|師傅|工程|空調/},
 {k:'charity',label:'公益單位',re:/家扶|公益|獎學金|學生/},
 {k:'family',label:'親友',re:/親友|家人|親戚/},
 {k:'friend',label:'朋友',re:/朋友/},
 {k:'staff',label:'員工',re:/員工|同仁|眷屬/},
 {k:'other',label:'其他',re:null}
];
const CAT=Object.fromEntries(CATS.map((c,i)=>[c.k,{...c,i}]));
// words in a table name that point to a category (for 照桌名填人)
const CAT_WORDS={vip:['主桌'],gov:['政商','政府','機關','民代','議員'],guest:['貴賓'],edu:['學校','教育','校長'],vendor:['廠商','原廠'],club:['社團','扶輪','獅子'],partner:['同行','協力','師傅'],charity:['家扶','公益','學生'],family:['親友','家人'],friend:['朋友'],staff:['員工','同仁']};
const KEY='kc-seating-v4';
let S, sel=new Set(), curT=null, view='plan', mode='seat', swapA=null, hlPid=null;
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function catOf(text){const t=String(text||'').trim();if(!t)return 'other';
  const ex=CATS.find(c=>c.label===t);if(ex)return ex.k;
  const m=CATS.find(c=>c.re&&c.re.test(t));return m?m.k:'other';}

// ---------- venue: 大中華國際美食館（照位置圖）----------
const COLS=[8.2,21.7,35.2,64.8,78.3,91.6];
const ROWS=[37,47.4,57.8,67.8,78,88];
function venueTables(){
  const t=[
    {id:'m1',no:'主1',name:'董事長主桌',named:true,x:72.3,y:24.2,main:true},
    {id:'m2',no:'主2',name:'總經理主桌',named:true,x:27.9,y:24.2,main:true}];
  ROWS.forEach((y,r)=>COLS.forEach((x,c)=>{const n=r*6+c+1;t.push({id:'t'+n,no:String(n),name:'',named:false,x,y});}));
  return t.map(o=>({cap:null,off:false,...o}));
}
const PILLARS=[{x:7.8,y:24.2},{x:90.6,y:24.2}];
const rank=t=>t.main?(t.id==='m1'?0:1):(t.y*1.0+Math.abs(t.x-50)*0.35);
const byNo=(a,b)=>(a.main?0:1)-(b.main?0:1)||(a.main?rank(a)-rank(b):((parseInt(a.no,10)||999)-(parseInt(b.no,10)||999)));

// ---------- state ----------
function blank(){return{cap:10,groups:[],people:[],tables:venueTables(),invites:[],sample:false};}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}schedulePush();syncArrivals();}
// ---------- shared sync (db): one document per person / group / table, so several editors don't overwrite each other ----------
let rdb=null,RO=false,pushT=null,arrive=new Map(),booted=false,failed=false;
const KINDS=[['sp','people'],['sg','groups'],['st','tables']];
const shadow={sp:new Map(),sg:new Map(),st:new Map()};let shadowMeta='';
const pending=new Set();const got={};let queue=[],inflight=0;
const sortK=o=>Array.isArray(o)?o.map(sortK):(o&&typeof o==='object')?Object.keys(o).sort().reduce((r,k)=>{if(o[k]!==undefined)r[k]=sortK(o[k]);return r;},{}):o;
const canon=o=>JSON.stringify(sortK(o));
const bodyOf=(k,x)=>{const o={...x};if(k==='sp')delete o.in;return canon(o);};
function setSync(t){const e=$('sync');if(e)e.textContent=t;}
function enqueue(id,fn){pending.add(id);queue.push({id,fn,tries:0});pump();}
function pump(){
  while(inflight<4&&queue.length){const job=queue.shift();inflight++;setSync('☁️ 儲存中…（'+(queue.length+inflight)+'）');
    job.fn().then(()=>{pending.delete(job.id);},e=>{
      if(e&&e.code==='invalid_argument'){pending.delete(job.id);setRO(true);showErr('通關密碼不正確，這次的變更沒有存到雲端。請重新整理頁面，再輸入正確的通關密碼。');}
      else if(job.tries<3){job.tries++;setTimeout(()=>{queue.push(job);pump();},1500*job.tries);}
      else{pending.delete(job.id);failed=true;}
    }).finally(()=>{inflight--;if(!queue.length&&!inflight)setSync(failed?'⚠️ 有資料沒存到，請重新整理':'☁️ 已同步');pump();});}
}
function schedulePush(){if(!rdb||RO||!S||S.sample||!booted)return;clearTimeout(pushT);pushT=setTimeout(pushNow,350);}
function pushNow(){pushT=null;if(!rdb||RO||!S||S.sample)return;
  let mx=S.people.reduce((m,p)=>Math.max(m,p.o||0),0);S.people.forEach(p=>{if(!p.o)p.o=++mx;});

  const unGroups=[...new Set(S.people.filter(p=>!p.t).map(p=>p.gid))].map(G);
  const log=new Map();let placed=0;const nofit=[];
  const matchUnit=(g,t)=>{const a=unitKey(g.unit),b=tableKey(t.name),br=unitKey(g.brand||'');return b.length>=2&&((a.length>=2&&(a.includes(b)||b.includes(a)))||(br.length>=2&&(br===b||b.includes(br)||br.includes(b))));};
  const matchCat=(g,t)=>{const b=tableKey(t.name);return (CAT_WORDS[g.cat]||[]).some(w=>b.includes(w))||b===CAT[g.cat].label;};
  const place=(g,tabs,byUnit)=>{const ps=S.people.filter(p=>p.gid===g.id&&!p.t);if(!ps.length)return;const n0=ps.length;
    const whole=tabs.find(t=>free(t)>=ps.length);
    const order=whole?[whole]:tabs;
    for(const t of order){if(!ps.length)break;const k=Math.min(free(t),ps.length);if(k<=0)continue;ps.splice(0,k).forEach(p=>{p.t=t.id;placed++;});log.set(t.no,(log.get(t.no)||[]).concat(g.unit));}
    if(ps.length&&(byUnit||ps.length<n0))nofit.push(`${g.unit} 還有 ${ps.length} 位`);};
  unGroups.forEach(g=>{const tabs=named.filter(t=>matchUnit(g,t));if(tabs.length)place(g,tabs,true);});
  unGroups.forEach(g=>{if(!S.people.some(p=>p.gid===g.id&&!p.t))return;const tabs=named.filter(t=>matchCat(g,t)&&!matchUnit(g,t)&&!named.some(x=>matchUnit(g,x)));if(tabs.length)place(g,tabs);});
  commit();
  openDlg(`<h3>照桌名填人</h3><p>已填入 <b>${placed}</b> 位，原本排好的人沒有變動。</p>
    ${log.size?`<div class="tw"><table class="mini-t"><tbody>${[...log.entries()].map(([no,us])=>`<tr><td style="padding:3px 8px;font-weight:900">第 ${esc(no)} 桌</td><td style="padding:3px 8px">${[...new Set(us)].map(esc).join('、')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">沒有找到桌名和單位對得上的人。桌名請直接用公司或單位的名稱（例如「日立」「聲寶」「扶輪社」），或用類別（例如「員工」「家扶」「學校」「社團」）。</p>'}
    ${nofit.length?`<p class="muted">位置不夠：${nofit.map(esc).join('、')}。可以把下一桌也取同樣的名字（例如「日立2」）再按一次。</p>`:''}
    <div class="acts"><button class="primary" id="dCancel">好</button></div>`);$('dCancel').onclick=closeDlg;
}

  let best=null,bn=0;for(const k in c)if(c[k]>bn||(c[k]===bn&&CAT[k].i<CAT[best].i)){best=k;bn=c[k];}return best;}

async function onInviteFile(file){

    const best=cols.map(o=>({c:o.c,score:aoa.filter(r=>S_(r[o.c]).length>=2&&isNaN(+r[o.c])).length})).sort((a,b)=>b.score-a.score);

    $('i_col').value=String(unitCol);
    const oc=aoa.slice(0,3).map(r=>r.findIndex(x=>/邀請對象|對象/.test(x))).find(i=>i>=0);if(oc!=null&&oc>=0)$('i_col2').value=String(oc);
    $('i_prev').textContent='預覽：'+aoa.slice(0,8).map(r=>S_(r[+$('i_col').value])).filter(Boolean).join('、');return aoa;};
  let aoa=load();$('i_sheet').onchange=()=>{aoa=load();};$('i_col').onchange=()=>{$('i_prev').textContent='預覽：'+aoa.slice(0,8).map(r=>S_(r[+$('i_col').value])).filter(Boolean).join('、');};
  $('dCancel').onclick=closeDlg;
  $('dOk').onclick=()=>{const c=+$('i_col').value,c2=$('i_col2').value;
    const list=aoa.map(r=>{const raw=S_(r[c]);if(!raw)return null;const p=parseInviteLine(raw);if(c2!=='')p.contact=S_(r[+c2]).replace(/\n/g,' ')||p.contact;return p;}).filter(Boolean);
    closeDlg();addInvites(list);};
}

  if(fallbackText!=null){try{await navigator.clipboard.writeText(fallbackText);toast('這裡無法下載，已複製到剪貼簿');}catch(_){toast('這裡無法下載檔案');}}

      const nw=c.measureText(t.no).width;font(700,Math.round(27*k));c.fillText(wrapText(c,t.name||'',w-nw-Math.round(90*k)),x0+22+nw,y0+hh/2);
      c.textAlign='right';font(500,Math.round(23*k));c.fillText(ps.length+'人',x0+w-12,y0+hh/2);
      c.textAlign='left';font(500,Math.round(26*k));c.fillStyle='#222';
      ps.slice(0,12).forEach((p,i)=>{const mark=(p.veg?'(素)':'')+(p.child?'👶':'');c.fillText(wrapText(c,`${i+1}. ${p.name}${mark}`,w-24),x0+12,y0+hh+lh*0.75+i*lh);});
      if(ps.length>12){c.fillStyle='#A3152A';c.fillText(`…另 ${ps.length-12} 位`,x0+12,y0+hh+lh*0.75+12*lh);}
      c.textAlign='center';
    }else{const r=tv?128:146;c.fillStyle='#fff';c.strokeStyle=ps.length?'#A97A1E':'#D6CEC0';c.lineWidth=tv?7:8;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fill();c.stroke();
      const has=!!(t.name||'').trim();
      c.fillStyle=ps.length?'#7A1520':'#B0A898';font(900,has?(tv?84:100):(tv?100:116),'"Noto Serif TC",serif');c.fillText(t.no,cx,has?cy-(tv?36:44):cy);
      if(has){c.fillStyle='#2E2622';font(700,42);const ls=fitLines(t.name,2*r-(tv?44:52),2);ls.forEach((l,i)=>c.fillText(l,cx,cy+(tv?28:36)+i*(tv?40:48)-(ls.length-1)*(tv?14:18)));}}
  });
  return await new Promise(res=>cv.toBlob(res,'image/jpeg',.92));
}

// ---------- 📋 Excel (ExcelJS) ----------
async function buildXlsx(){
  const wb=new ExcelJS.Workbook();wb.creator='冠成尾牙座位系統';
  const red='FF7A1520',gold='FFF3E7CF',thin={style:'thin',color:{argb:'FF999999'}},box={top:thin,left:thin,bottom:thin,right:thin};
  // sheet 1: 圖形化座位表
  const ws=wb.addWorksheet('圖形化座位表',{pageSetup:{paperSize:8,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1,margins:{left:.3,right:.3,top:.4,bottom:.4,header:.2,footer:.2}}});
  const colOf={0:1,1:3,2:5,3:8,4:10,5:12};// table columns, aisle at col 7
  ws.columns=Array.from({length:12},(_,i)=>({width:[1,3,5,8,10,12].map(x=>x-1).includes(i)?20:(i===6?8:2)}));
  ws.mergeCells(1,1,1,12);const ti=ws.getCell(1,1);ti.value='冠成家電 尾牙座位表（大中華國際美食館）';ti.font={size:18,bold:true,color:{argb:red}};ti.alignment={horizontal:'center'};
  ws.mergeCells(2,3,2,10);const st=ws.getCell(2,3);st.value='舞　　台';st.font={size:16,bold:true,color:{argb:'FFFFFFFF'}};st.fill={type:'pattern',pattern:'solid',fgColor:{argb:red}};st.alignment={horizontal:'center',vertical:'middle'};ws.getRow(2).height=34;
  const block=(t,r0,col)=>{const ps=inT(t.id);const cap=Math.max(capOf(t),ps.length);
    const h=ws.getCell(r0,col);h.value=`${t.no}　${t.name||''}（${ps.length}人）`;h.font={bold:true,color:{argb:'FFFFFFFF'},size:11};h.fill={type:'pattern',pattern:'solid',fgColor:{argb:red}};h.border=box;h.alignment={vertical:'middle'};
    for(let i=0;i<cap;i++){const p=ps[i];const cl=ws.getCell(r0+1+i,col);cl.value=p?`${i+1}. ${p.name}${p.veg?'（素）':''}${p.nobeef?'（不吃牛）':''}${p.child?'（兒童椅）':''}`:`${i+1}.`;cl.border=box;cl.font={size:10,color:{argb:p?'FF222222':'FFBBBBBB'}};}
    return cap+1;};
  let r=4;const mains=S.tables.filter(t=>t.main&&!t.off);
  let hmax=0;mains.forEach(t=>{hmax=Math.max(hmax,block(t,r,t.id==='m2'?colOf[1]:colOf[4]));});r+=hmax+1;
  ROWS.forEach((y,ri)=>{let hm=0;COLS.forEach((x,ci)=>{const t=S.tables.find(t=>t.id==='t'+(ri*6+ci+1));if(t&&!t.off)hm=Math.max(hm,block(t,r,colOf[ci]));});
    if(ri===0){ws.getCell(r,7).value='走';}if(ri===2){ws.getCell(r,7).value='道';}ws.getCell(r,7).alignment={horizontal:'center'};r+=hm+1;});
  const extras=S.tables.filter(t=>t.extra&&!t.off);for(let i=0;i<extras.length;i+=6){let hm=0;extras.slice(i,i+6).forEach((t,ci)=>{hm=Math.max(hm,block(t,r,colOf[ci]));});r+=hm+1;}
  ws.getCell(r,3).value='小門';ws.getCell(r,5).value='正門';ws.getCell(r,8).value='小門';[3,5,8].forEach(cn=>{ws.getCell(r,cn).font={bold:true};ws.getCell(r,cn).alignment={horizontal:'center'};});
  // sheet 2: 名單列表
  const ls=wb.addWorksheet('名單列表',{views:[{state:'frozen',ySplit:1}]});
  ls.columns=[{header:'桌號',key:'no',width:7},{header:'桌名',key:'tn',width:16},{header:'姓名',key:'n',width:16},{header:'單位',key:'u',width:24},{header:'類別',key:'c',width:10},{header:'素食',key:'v',width:6},{header:'不吃牛',key:'b',width:7},{header:'兒童椅',key:'ch',width:7},{header:'上台',key:'s',width:6},{header:'行動不便',key:'m',width:8},{header:'報到',key:'in',width:6},{header:'備註',key:'note',width:24}];
  const rows=S.people.map(p=>{const g=G(p.gid),t=T(p.t);return{no:t?t.no:'未安排',tn:t?t.name:'',n:p.name,u:g.unit,c:CAT[g.cat].label,v:p.veg?'素':'',b:p.nobeef?'✓':'',ch:p.child?'✓':'',s:p.stage?'✓':'',m:p.mob?'✓':'',in:p.in?'✓':'',note:g.note||''};});
  rows.sort((a,b)=>String(a.no).localeCompare(String(b.no),'zh-Hant',{numeric:true})||a.u.localeCompare(b.u,'zh-Hant'));ls.addRows(rows);
  ls.getRow(1).font={bold:true,color:{argb:'FFFFFFFF'}};ls.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:red}};ls.autoFilter={from:'A1',to:'L1'};
  // sheet 3: 出菜統計
  const ks=wb.addWorksheet('出菜統計');ks.columns=[{header:'桌號',width:7},{header:'桌名',width:18},{header:'人數',width:7},{header:'葷',width:6},{header:'素',width:6},{header:'不吃牛',width:8},{header:'兒童椅',width:8}];
  const kr=kitchenRows();kr.forEach(x=>ks.addRow([x.t.no,x.t.name,x.n,x.n-x.veg,x.veg,x.nb,x.ch]));
  const sum=k=>kr.reduce((a,x)=>a+x[k],0);const tr=ks.addRow([`合計 ${kr.length} 桌`,'',sum('n'),sum('n')-sum('veg'),sum('veg'),sum('nb'),sum('ch')]);tr.font={bold:true};
  ks.getRow(1).font={bold:true};ks.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:gold}};
  // sheet 4: 贊助品
  const sp=wb.addWorksheet('贊助品');sp.columns=[{header:'贊助單位',width:24},{header:'填表人',width:16},{header:'獎品',width:50},{header:'交付日',width:12},{header:'是否已收到',width:10},{header:'抽獎順序',width:10}];
  S.groups.filter(g=>g.sponsor).forEach(g=>sp.addRow([g.unit,[g.person,g.title].filter(Boolean).join(' '),[g.gift1,g.gift2].filter(Boolean).join('；'),g.due||'','','']));sp.getRow(1).font={bold:true};
  // sheet 5: 未回覆
  if((S.invites||[]).length){const iv=wb.addWorksheet('回覆追蹤');iv.columns=[{header:'邀請單位',width:26},{header:'邀請對象',width:24},{header:'狀態',width:10},{header:'出席人數',width:9}];
    S.invites.forEach(i=>{const g=invMatch(i);iv.addRow([i.unit,i.contact||'',g?'已回覆':'未回覆',g?g.count:'']);});iv.getRow(1).font={bold:true};}
  return new Uint8Array(await wb.xlsx.writeBuffer());
}

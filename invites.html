<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.__KC_PREFIXES=['invites/','config/'];</script><script>/* Stand-in for the Claude page runtime: the same claude.use('db') / ('downloads') calls,
   backed by the 冠成 Apps Script + Google Sheet, with a shared passcode. */
(()=>{
const API='https://script.google.com/macros/s/AKfycbx4J4jwRwaeZ1l8qbJXbwGf486TUU8jgg4FR1YHfr9CZgAne3XlDPVl-ayJx8q2mGw/exec';
const PREFIXES=window.__KC_PREFIXES||null;
const KEYK='kc37-passcode';
let key=null;try{key=localStorage.getItem(KEYK);}catch(_){}
async function call(body,tries=0){
  let r;try{r=await fetch(API,{method:'POST',body:JSON.stringify({...body,key})});}
  catch(e){if(tries<2){await new Promise(s=>setTimeout(s,1200*(tries+1)));return call(body,tries+1);}const x=new Error('network');x.code='unavailable';throw x;}
  let j;try{j=await r.json();}catch(_){const x=new Error('bad response');x.code='unavailable';throw x;}
  if(!j.ok){const x=new Error(j.error||'error');x.code=j.error==='bad_key'?'invalid_argument':'unavailable';x.badKey=j.error==='bad_key';throw x;}
  return j;
}
window.__kcCall=call;

// ---------- passcode gate ----------
let readyRes;const ready=new Promise(r=>readyRes=r);
function gate(msg){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:16px;background:rgba(30,10,12,.72)';
  d.innerHTML=`<form style="background:#FFFDF9;color:#2E2622;border-radius:18px;border-top:4px solid #7A1520;padding:26px 24px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;box-shadow:0 24px 70px rgba(0,0,0,.4)">
    <div style="font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;letter-spacing:.06em">請輸入通關密碼</div>
    <div style="font-size:15px;color:#5C514A">冠成尾牙內部使用，密碼請向負責同仁索取。這台裝置輸入一次就會記住。</div>
    <input id="kcPass" autocomplete="current-password" type="password" style="font:inherit;font-size:18px;padding:10px 12px;border:1px solid #D9BF8A;border-radius:10px" aria-label="通關密碼">
    <div id="kcErr" style="color:#B5541B;font-size:14px;min-height:1em">${msg||''}</div>
    <button style="font:inherit;font-size:17px;font-weight:700;padding:10px;border:none;border-radius:999px;background:#7A1520;color:#F6E7C8;cursor:pointer">進入</button></form>`;
  document.body.appendChild(d);const f=d.querySelector('form');setTimeout(()=>d.querySelector('input').focus(),0);
  f.onsubmit=async e=>{e.preventDefault();const v=d.querySelector('input').value.trim();if(!v)return;key=v;d.querySelector('#kcErr').textContent='確認中…';
    try{await call({op:'list',since:Date.now()+86400000});try{localStorage.setItem(KEYK,key);}catch(_){}d.remove();readyRes();}
    catch(err){d.querySelector('#kcErr').textContent=err.badKey?'密碼不對，請再確認一次。':'連不上伺服器，請檢查網路後再試。';}};
}
async function start(){
  if(key){try{await call({op:'list',since:Date.now()+86400000});readyRes();return;}catch(e){if(!e.badKey){readyRes();return;}}}
  gate(key?'密碼已變更，請重新輸入。':'');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
window.kcLogout=()=>{try{localStorage.removeItem(KEYK);}catch(_){}location.reload();};

// ---------- document store with polling ----------
const cache=new Map();           // "coll/id" -> data
const colL=new Map(),docL=new Map();
const pend=new Map();            // key -> {json, waiters:[]}
const inflight=new Set();
let since=0,firstDone=false,firstRes;const first=new Promise(r=>firstRes=r);
const depth=p=>p.split('/').length;
const snapOf=(id,v)=>({id,exists:v!==undefined,data:()=>v,metadata:{fromCache:false,hasPendingWrites:false}});
function colSnap(c){const docs=[];cache.forEach((v,k)=>{if(k.startsWith(c+'/')&&depth(k)===depth(c)+1)docs.push(snapOf(k.slice(c.length+1),v));});
  docs.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};}
function emit(keys){const cs=new Set(),ds=new Set();keys.forEach(k=>{ds.add(k);cs.add(k.slice(0,k.lastIndexOf('/')));});
  cs.forEach(c=>(colL.get(c)||[]).forEach(fn=>{try{fn(colSnap(c));}catch(e){console.error(e);}}));
  ds.forEach(d=>(docL.get(d)||[]).forEach(fn=>{try{fn(snapOf(d.split('/').pop(),cache.get(d)));}catch(e){console.error(e);}}));}
async function poll(){
  try{const j=await call({op:'list',since,prefixes:PREFIXES});
    const ch=[];
    j.docs.forEach(d=>{if(pend.has(d.k)||inflight.has(d.k))return;
      if(d.del){if(cache.has(d.k)){cache.delete(d.k);ch.push(d.k);}}
      else{const cur=cache.get(d.k);if(cur===undefined||JSON.stringify(cur)!==d.json){try{cache.set(d.k,JSON.parse(d.json));ch.push(d.k);}catch(_){}}}});
    since=j.now-4000;
    if(!firstDone){firstDone=true;firstRes();colL.forEach((fns,c)=>fns.forEach(fn=>fn(colSnap(c))));docL.forEach((fns,d)=>fns.forEach(fn=>fn(snapOf(d.split('/').pop(),cache.get(d)))));}
    else if(ch.length)emit(ch);
    setStatus('');
  }catch(e){if(e.badKey){gate('密碼已變更，請重新輸入。');return;}setStatus('offline');}
  setTimeout(poll,document.hidden?30000:6000);
}
ready.then(poll);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&firstDone)poll();});
let flushT=null;
function queue(k,json){return new Promise((res,rej)=>{const p=pend.get(k)||{waiters:[]};p.json=json;p.waiters.push({res,rej});pend.set(k,p);clearTimeout(flushT);flushT=setTimeout(flush,250);});}
async function flush(){if(!pend.size)return;const items=[...pend.entries()].slice(0,150);items.forEach(([k])=>{pend.delete(k);inflight.add(k);});
  try{await call({op:'write',writes:items.map(([k,p])=>({k,json:p.json}))});items.forEach(([,p])=>p.waiters.forEach(w=>w.res()));}
  catch(e){items.forEach(([k,p])=>p.waiters.forEach(w=>w.rej(e)));}
  finally{items.forEach(([k])=>inflight.delete(k));if(pend.size)flush();}}
function setOne(k,data){const d=JSON.parse(JSON.stringify(data));cache.set(k,d);emit([k]);return queue(k,JSON.stringify(d));}
function delOne(k){cache.delete(k);emit([k]);return queue(k,null);}
function docRef(path){return{id:path.split('/').pop(),path,
  set:d=>setOne(path,d),
  update:d=>setOne(path,{...(cache.get(path)||{}),...d}),
  delete:()=>delOne(path),
  get:async()=>{await first;return snapOf(path.split('/').pop(),cache.get(path));},
  onSnapshot:(fn)=>{if(!docL.has(path))docL.set(path,[]);docL.get(path).push(fn);if(firstDone)setTimeout(()=>fn(snapOf(path.split('/').pop(),cache.get(path))),0);return()=>{const a=docL.get(path);a.splice(a.indexOf(fn),1);};},
  collection:c=>colRef(path+'/'+c)};}
function colRef(c){return{path:c,doc:id=>docRef(c+'/'+(id||Math.random().toString(36).slice(2,12))),
  add:async d=>{const r=docRef(c+'/'+Math.random().toString(36).slice(2,12));await r.set(d);return r;},
  get:async()=>{await first;return colSnap(c);},
  onSnapshot:(fn)=>{if(!colL.has(c))colL.set(c,[]);colL.get(c).push(fn);if(firstDone)setTimeout(()=>fn(colSnap(c)),0);return()=>{const a=colL.get(c);a.splice(a.indexOf(fn),1);};}};}
const db={doc:docRef,collection:colRef};
window.addEventListener('beforeunload',e=>{if(pend.size||inflight.size){e.preventDefault();e.returnValue='';}});

// ---------- connection badge ----------
let badge=null;
function setStatus(s){if(!badge){badge=document.createElement('div');badge.style.cssText='position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;background:#B5541B;color:#fff;border-radius:999px;padding:6px 14px;font:600 14px "Noto Sans TC",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)';badge.hidden=true;document.body.appendChild(badge);}
  badge.hidden=!s;badge.textContent='⚠️ 網路中斷，恢復後會自動同步';}

// ---------- downloads ----------
const downloads={save:async({filename,data})=>{
  const type=/\.html?$/i.test(filename)?'text/html;charset=utf-8':/\.xlsx$/i.test(filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':/\.json$/i.test(filename)?'application/json':/\.jpe?g$/i.test(filename)?'image/jpeg':'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});const url=URL.createObjectURL(blob);
  if(/\.html?$/i.test(filename)){const w=window.open(url,'_blank');if(w){setTimeout(()=>URL.revokeObjectURL(url),60000);return;}}
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}};

// ---------- back to top ----------
function topBtn(){const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','回到最上面');b.title='回到最上面';
  b.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span style="font-size:12px;font-weight:700;line-height:1">頂部</span>';
  b.style.cssText='position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;width:60px;height:60px;border-radius:50%;border:none;background:#7A1520;color:#F6E7C8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 8px 24px rgba(78,11,19,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(8px);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif';
  b.onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  document.body.appendChild(b);
  const upd=()=>{const on=window.scrollY>500;b.style.opacity=on?'1':'0';b.style.pointerEvents=on?'auto':'none';b.style.transform=on?'none':'translateY(8px)';};
  window.addEventListener('scroll',upd,{passive:true});upd();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',topBtn);else topBtn();

window.claude={use:async n=>{if(n==='db'){await ready;return db;}if(n==='downloads')return downloads;return null;}};
})();
</script></head><body><title>冠成尾牙邀請名冊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: a lacquer-red register cover (title + headcount + overall progress), then the four-step pipeline as the filter, then a ledger grouped by category. Same lacquer & gold as the invitation site. */
:root{
  --paper:#FAF6EE; --sheet:#FFFDF9; --sunk:#F3ECDF; --hair:#E6DACA;
  --ink:#2E2622; --ink-2:#5C514A; --muted:#8C7F74;
  --lacquer:#7A1520; --lacquer-deep:#4E0B13; --on-lacquer:#F6E7C8;
  --gold:#A8843F; --gold-line:#D9BF8A; --gold-pale:#F4E7CB;
  --ok:#2F6F4A; --ok-pale:#E3EFE6; --warn:#B5541B; --warn-pale:#F8E8DC;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --num:"Cormorant Garamond","Times New Roman",serif;
  --shadow:0 1px 0 rgba(78,11,19,.04),0 8px 24px -12px rgba(78,11,19,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16110F; --sheet:#1F1916; --sunk:#29211D; --hair:#3A302A;
  --ink:#F1E9DF; --ink-2:#CDBFB1; --muted:#9E9084;
  --lacquer:#5E1019; --lacquer-deep:#3A070E; --on-lacquer:#F3E2BF;
  --gold:#D8B46E; --gold-line:#8C7340; --gold-pale:#3A2F1C;
  --ok:#6CC08F; --ok-pale:#1F3328; --warn:#F09A62; --warn-pale:#3B2619;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16110F; --sheet:#1F1916; --sunk:#29211D; --hair:#3A302A;
  --ink:#F1E9DF; --ink-2:#CDBFB1; --muted:#9E9084;
  --lacquer:#5E1019; --lacquer-deep:#3A070E; --on-lacquer:#F3E2BF;
  --gold:#D8B46E; --gold-line:#8C7340; --gold-pale:#3A2F1C;
  --ok:#6CC08F; --ok-pale:#1F3328; --warn:#F09A62; --warn-pale:#3B2619;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17.7px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-family:var(--num);font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1}
button{font:inherit;font-size:16.5px;border:1px solid var(--hair);background:var(--sheet);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:40px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--gold)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--lacquer);border-color:var(--lacquer);color:var(--on-lacquer);font-weight:700}
button.primary:hover{background:var(--lacquer-deep)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--hair)}
button.no{color:var(--muted)}
input,select,textarea{font:inherit;font-size:16.5px;color:var(--ink);background:var(--sheet);border:1px solid var(--hair);border-radius:10px;padding:7px 11px}
textarea{width:100%;min-height:90px;resize:vertical}

/* cover */
.cover{background:radial-gradient(120% 140% at 85% 0%,var(--lacquer) 0%,var(--lacquer-deep) 75%);color:var(--on-lacquer)}
.cover .in{max-width:1180px;margin:0 auto;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.frame{border:1px solid color-mix(in srgb,var(--gold-line) 70%,transparent);outline:1px solid color-mix(in srgb,var(--gold-line) 35%,transparent);outline-offset:-7px;border-radius:4px;padding:22px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 32px;align-items:end}
@media (max-width:720px){.frame{grid-template-columns:minmax(0,1fr);padding:18px}}
.eyebrow{font-family:var(--num);font-style:italic;font-size:18.7px;letter-spacing:.06em;color:var(--gold-line)}
.cover h1{margin:2px 0 4px;font-family:var(--display);font-weight:900;font-size:clamp(28px,4.4vw,40px);letter-spacing:.08em;line-height:1.2;text-wrap:balance}
.cover .sub{font-size:15.9px;opacity:.85;letter-spacing:.04em}
.head{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
@media (max-width:720px){.head{align-items:flex-start;text-align:left}}
.head .lbl{font-size:14.8px;letter-spacing:.14em;color:var(--gold-line)}
.head .big{display:flex;align-items:baseline;gap:6px;line-height:1}
.head .big b{font-family:var(--num);font-size:70.4px;font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;color:#fff}
.head .big span{font-size:17.7px}
.head .units{font-size:15.9px;opacity:.85}
.prog{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.bar{height:6px;border-radius:999px;background:color-mix(in srgb,var(--on-lacquer) 18%,transparent);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b1{background:var(--gold-line)}.bar .b2{background:color-mix(in srgb,var(--gold-line) 55%,transparent)}
.prog small{font-size:14.8px;opacity:.85;display:flex;gap:14px;flex-wrap:wrap}
.prog small i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}

.wrap{max-width:1180px;margin:-40px auto 0;padding-block:0 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;position:relative}

/* pipeline */
.pipe{background:var(--sheet);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:hidden}
@media (max-width:720px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{border:none;border-radius:0;background:transparent;flex-direction:column;align-items:flex-start;gap:2px;padding:16px 18px 14px;white-space:normal;text-align:left;position:relative;min-height:0}
.st+.st{border-left:1px solid var(--hair)}
@media (max-width:720px){.st:nth-child(3){border-left:none}.st:nth-child(n+3){border-top:1px solid var(--hair)}}
.st:hover{background:var(--sunk);border-color:var(--hair)}
.st .k{font-size:15.3px;color:var(--ink-2);display:flex;gap:8px;align-items:center;font-weight:700;letter-spacing:.04em}
.st .k i{font-style:normal;font-family:var(--body);font-size:14.2px;width:22px;height:22px;border-radius:50%;border:1px solid var(--gold-line);display:inline-grid;place-items:center;color:var(--gold);font-weight:600}
.st b{font-family:var(--num);font-weight:600;font-size:48.4px;line-height:1.05;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1}
.st small{font-size:14.8px;color:var(--muted)}
.st.on{background:var(--gold-pale)}
.st.on::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--lacquer)}
.st.s-boss b{color:var(--gold)}.st.s-wait b{color:var(--warn)}.st.s-replied b{color:var(--ok)}
.st .arrow{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-top:1px solid var(--hair);border-right:1px solid var(--hair);background:var(--sheet);rotate:45deg;z-index:1}
.st.on .arrow{background:var(--gold-pale)}
@media (max-width:720px){.st .arrow{display:none}}

/* controls */
.controls{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;padding-left:34px;border-radius:999px;min-height:40px}
.search::before{content:"";position:absolute;left:13px;top:50%;width:11px;height:11px;border:1.6px solid var(--muted);border-radius:50%;transform:translateY(-62%)}
.search::after{content:"";position:absolute;left:23px;top:58%;width:6px;height:1.6px;background:var(--muted);rotate:45deg}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cat{flex-direction:column;align-items:stretch;gap:6px;border-radius:12px;padding:10px 12px 11px;background:var(--sheet);text-align:left;white-space:normal;min-height:0}
.cat .t{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cat .t span{font-family:var(--display);font-weight:700;font-size:17.7px;letter-spacing:.04em}
.cat .t b{font-family:var(--num);font-weight:600;font-size:26.4px;line-height:1;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;color:var(--ink-2)}
.cat .sb{height:5px;border-radius:999px;background:var(--sunk);display:flex;overflow:hidden}
.cat .sb i{display:block;height:100%}
.sb .g1{background:var(--gold-line)}.sb .g2{background:var(--ink-2);opacity:.35}.sb .g3{background:var(--warn)}.sb .g4{background:var(--ok)}
.cat small{font-size:13.6px;color:var(--muted)}
.cat.on{border-color:var(--lacquer);box-shadow:inset 0 0 0 1px var(--lacquer);background:color-mix(in srgb,var(--gold-pale) 60%,var(--sheet))}
.cat.on .t b{color:var(--lacquer)}

<script>
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S_=v=>String(v??'').trim();
const GROUPS=['廠商','外包師傅','協力廠商','政商','教育界','廠牌高層','社團親友','柏緯朋友','員工','公益','其他貴賓','網站新報名'];
const DEF_CFG={date:'116 年 1 月（日期確認中）',time:'下午 5:50 入席，6:00 準時開始',venue:'大中華國際美食館（彰化縣和美鎮彰美路四段 306 號）',site:'https://leanna0303.github.io/guancheng-weiya/',deadline:'',sender:'冠成家電'};
let db=null,sample=null,dl=null,canWrite=true,live=false;
let INV=new Map(),CFG={...DEF_CFG};
let filt='all',fgSel='',bossOpen=false,bossAll=false;
let viewMode=(()=>{try{const v=localStorage.getItem('kc-inv-view');if(v)return v;}catch(_){}return matchMedia('(min-width:900px)').matches?'table':'card';})();

// ---------- stage ----------
function target(i){return i.merge?[...INV.values()].find(x=>!x.merge&&x.unit===i.merge):null;}
function stage(i){
  if(i.boss==='no')return'skip';
  if(i.boss!=='yes')return'boss';
  if(!i.sent)return'send';
  if(i.merge){return'replied';}
  if(!i.reply)return'wait';
  return'replied';
}
const STAGES=[['boss','老闆確認','1','還沒確認要不要邀'],['send','待發送','2','確認邀請、還沒發出'],['wait','等回覆','3','已發出、還沒回覆'],['replied','已回覆','4','']];
const days=d=>d?Math.floor((Date.now()-new Date(d).getTime())/864e5):null;
const today=()=>new Date().toLocaleDateString('sv-SE');
const people=i=>i.reply==='yes'?(Number(i.count)||0):0;

// ---------- render ----------
function render(){
  const all=[...INV.values()];
  const cnt=k=>all.filter(i=>stage(i)===k).length;
  const att=all.filter(i=>!i.merge&&i.reply==='yes');
  const total=att.reduce((a,i)=>a+people(i),0);
  const act=all.filter(i=>stage(i)!=='skip'&&!i.merge);const done=act.filter(i=>stage(i)==='replied').length,sent=act.filter(i=>stage(i)==='wait').length;
  const pct=n=>act.length?(n/act.length*100).toFixed(1)+'%':'0%';
  $('head').innerHTML=`<span class="lbl">確定出席</span><div class="big"><b>${total}</b><span>位</span></div><span class="units">${att.length} 個單位　·　不克出席 ${all.filter(i=>!i.merge&&i.reply==='no').length}</span>`;
  $('prog').innerHTML=`<div class="bar" role="img" aria-label="已回覆 ${done}、等回覆 ${sent}、共 ${act.length}"><i class="b1" style="width:${pct(done)}"></i><i class="b2" style="width:${pct(sent)}"></i></div>
    <small><span><i style="background:var(--gold-line)"></i>已回覆 ${done}</span><span><i style="background:color-mix(in srgb,var(--gold-line) 55%,transparent)"></i>已發出等回覆 ${sent}</span><span>邀請中 ${act.length} 筆${cnt('skip')?`・不邀請 ${cnt('skip')}`:''}</span></small>`;
  $('stages').innerHTML=STAGES.map(([k,l,n,hint],ix)=>{const v=cnt(k);
    const extra=k==='replied'?`出席 ${att.length}・不克 ${all.filter(i=>!i.merge&&i.reply==='no').length}`:hint;
    return `<button class="st s-${k}${filt===k?' on':''}" data-filt="${k}" aria-pressed="${filt===k}"><span class="k"><i>${n}</i>${l}</span><b>${v}</b><small>${esc(extra)}</small>${ix<3?'<span class="arrow" aria-hidden="true"></span>':''}</button>`;}).join('');
  const inF=all.filter(i=>filt==='all'?stage(i)!=='skip':stage(i)===filt);
  const gs=[...new Set(all.map(i=>i.group))].sort((a,b)=>(GROUPS.indexOf(a)+99)%99-(GROUPS.indexOf(b)+99)%99);
  if(fgSel&&!gs.includes(fgSel))fgSel='';
  const catCard=(g,list,label)=>{const L=list.filter(i=>stage(i)!=='skip');const c=k=>L.filter(i=>stage(i)===k).length;const tot=L.length||1;
    const ppl=list.filter(i=>!i.merge&&i.reply==='yes').reduce((a,i)=>a+people(i),0);const n=inF.filter(i=>g===''||i.group===g).length;
    return `<button class="cat${fgSel===g?' on':''}" data-fg="${esc(g)}" aria-pressed="${fgSel===g}"><span class="t"><span>${esc(label)}</span><b>${filt==='all'?L.length:n}</b></span>
      <span class="sb" aria-hidden="true"><i class="g4" style="width:${c('replied')/tot*100}%"></i><i class="g3" style="width:${c('wait')/tot*100}%"></i><i class="g2" style="width:${c('send')/tot*100}%"></i><i class="g1" style="width:${c('boss')/tot*100}%"></i></span>
      <small>${ppl?`確定 ${ppl} 位・`:''}${c('replied')}/${L.length} 已回覆</small></button>`;};
  $('chips').innerHTML=catCard('',all,'全部分類')+gs.map(g=>{const list=all.filter(i=>i.group===g);return (filt==='all'||inF.some(i=>i.group===g)||fgSel===g)?catCard(g,list,g):'';}).join('');
  $('vTable').classList.toggle('on',viewMode==='table');$('allStages').hidden=filt==='all';$('vCard').classList.toggle('on',viewMode==='card');
  const q=S_($('q').value).toLowerCase(),fg=fgSel;
  const shown=all.filter(i=>(filt==='all'?stage(i)!=='skip':stage(i)===filt)&&(!fg||i.group===fg)&&(!q||[i.unit,i.contact,i.names,i.lyNames].join(' ').toLowerCase().includes(q)));
  const byG=new Map();shown.forEach(i=>{if(!byG.has(i.group))byG.set(i.group,[]);byG.get(i.group).push(i);});
  const order=[...byG.keys()].sort((a,b)=>(GROUPS.indexOf(a)+99)%99-(GROUPS.indexOf(b)+99)%99);
  $('list').innerHTML=order.length?order.map(g=>{const its=byG.get(g).sort((a,b)=>a.id.localeCompare(b.id));
    const ppl=its.filter(i=>!i.merge&&i.reply==='yes').reduce((a,i)=>a+people(i),0),ly=its.reduce((a,i)=>a+(Number(i.lyCount)||0),0);
    const head=`<h2>${esc(g)}<span>${its.length} 筆${ly?`・去年 ${ly} 位`:''}${ppl?`・今年確定 ${ppl} 位`:''}</span></h2>`;
    return viewMode==='table'?`<section class="grp">${head}<div class="tw"><table class="lg"><thead><tr><th style="width:21%">單位</th><th style="width:15%">邀請對象</th><th style="width:5%;text-align:center">去年</th><th style="width:18%">去年贊助／備註</th><th style="width:19%">今年進度</th><th style="text-align:right">操作</th></tr></thead><tbody>${its.map(trHTML).join('')}</tbody></table></div></section>`
      :`<section class="grp">${head}<div class="sheet">${its.map(rowHTML).join('')}</div></section>`;}).join('')
    :`<div class="sheet"><div class="empty">${INV.size?(filt==='wait'?'<b>目前沒有等待回覆的單位</b>發出的邀請都有回音了。':filt==='boss'?'<b>名單都確認好了</b>可以到「待發送」開始發邀請。':'<b>這個條件下沒有資料</b>換個分類或清掉搜尋試試。'):(live?'<b>還沒有名單</b>按「＋ 新增邀請」加入第一筆。':'<b>名冊載入中…</b>')}</div></div>`;
  document.querySelectorAll('[data-w]').forEach(b=>b.hidden=!canWrite);
  if(bossOpen)renderBoss();
}
function lyHTML(i){const a=[];if(i.lyCount!=null)a.push(`<span><em>去年</em>${i.lyCount} 人</span>`);if(i.lyGift)a.push(`<span><em>贊助</em>${esc(i.lyGift)}</span>`);if(i.lyNote)a.push(`<span>${esc(i.lyNote)}</span>`);return a.join('');}
function lyText(i){const a=[];if(i.lyCount!=null)a.push(`去年 ${i.lyCount} 人`);if(i.lyGift)a.push(`贊助 ${i.lyGift}`);if(i.lyNote)a.push(i.lyNote);return a.join('・');}
function parts(i){const st=stage(i);const w=canWrite;
  let state='',acts='';
  if(st==='boss'){state='<span class="stamp p-boss">待老闆確認</span>';acts=w?`<button class="ok" data-boss="${i.id}" data-v="yes">✓ 邀請</button><button class="no" data-boss="${i.id}" data-v="no">不邀</button><button class="ghost" data-reply="${i.id}" title="已經口頭或 LINE 回覆了">已回覆？</button>`:'';}
  else if(st==='skip'){state=`<span class="stamp p-skip">不邀請</span>${i.bossNote?esc(i.bossNote):''}`;acts=w?`<button class="ghost" data-boss="${i.id}" data-v="pending">改回待確認</button>`:'';}
  else if(st==='send'){state=`<span class="stamp p-send">待發送</span><span class="meta">${esc(i.channel||'')}</span>`;
    acts=w?`<button data-msg="${i.id}" data-k="invite">寫邀請訊息</button><button class="ok" data-sent="${i.id}">✓ 已發送</button><button class="ghost" data-reply="${i.id}" title="已經口頭或 LINE 回覆了">已回覆？</button><button class="ghost" data-boss="${i.id}" data-v="pending" title="退回「老闆確認」">改回待確認</button>`:'';}
  else if(st==='wait'){const d=days(i.sentAt);const r=(i.reminders||[]).length;
    state=`<span class="stamp p-wait">等回覆</span><span class="meta">${i.sentAt?`${i.sentAt.slice(5).replace('-','/')} 發送・${d} 天`:''}${r?`・催過 ${r} 次`:''}</span>`;
    acts=w?`<button data-msg="${i.id}" data-k="remind">寫提醒訊息</button><button class="primary" data-reply="${i.id}">登記回覆</button>`:'';}
  else{if(i.merge){const t=target(i);state=`<span class="stamp p-send">已寄卡</span><span class="meta">回覆併入「${esc(i.merge)}」${t&&t.reply?(t.reply==='yes'?`・${t.count} 人出席`:'・不克出席'):''}</span>`;}

// ---------- writes ----------
async function save(i){if(!canWrite){toast('這個畫面是唯讀的');return false;}
  const {_justDecided,...body}=i;body.updatedAt=Date.now();INV.set(i.id,{...i,updatedAt:body.updatedAt});render();
  if(!db)return true;
  try{await db.collection('invites').doc(i.id).set(body);return true;}
  catch(e){if(e&&e.code==='invalid_argument'){canWrite=false;$('roBanner').hidden=false;render();toast('你沒有修改權限');}else if(e&&e.code==='quota_exceeded')toast('資料庫已滿，無法新增');else toast('儲存失敗，請稍後再試');return false;}}
async function saveMany(list){let ok=0;for(const i of list){if(await save(i))ok++;}return ok;}
const clone=i=>JSON.parse(JSON.stringify(i));

    closeDlg();await save(i);toast('已儲存');};
}

const ukey=s=>String(s||'').replace(/（.*?）|\(.*?\)/g,'').replace(/股份有限公司|有限公司|股份|公司|企業社|台灣|銷售|\s/g,'').toLowerCase();
const CAT2G={'廠商':'廠商','同行':'外包師傅','學校／教育界':'教育界','學校':'教育界','社團':'社團親友','政商貴賓':'政商','政府機關／民代':'政商','貴賓':'其他貴賓','親友':'社團親友','朋友':'柏緯朋友'};
function findInv(unit){const k=ukey(unit);if(k.length<2)return null;
  const c=[...INV.values()].filter(i=>!i.merge&&i.src!=='網站新報名');
  return c.find(i=>ukey(i.unit)===k)||c.find(i=>{const a=ukey(i.unit);return a.length>=2&&(a.includes(k)||k.includes(a));})||null;}
async function importWeb(file){
  if(typeof XLSX==='undefined'){toast('讀檔元件載入失敗，請重新整理');return;}
  let rows;try{const wb=/\.csv$/i.test(file.name)?XLSX.read(await file.text(),{type:'string'}):XLSX.read(await file.arrayBuffer(),{type:'array'});
    rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});}catch(_){toast('無法讀取這個檔案');return;}
  return importRows(rows);}
async function importRows(rows,mode){
  const H=(r,re)=>{const k=Object.keys(r).find(h=>re.test(h));return k?S_(r[k]):'';};
  const recs=rows.map(r=>({brand:H(r,/品牌/),unit:H(r,/公司|單位名稱/),cat:H(r,/類別/),person:H(r,/貴姓|填表人/),title:H(r,/職稱/),attend:H(r,/是否出席/),count:H(r,/總參加人數|參加人數/),names:H(r,/參加人員|名單/),veg:H(r,/素食/),gift:[H(r,/獎品[（(]?一/),H(r,/獎品[（(]?二/)].filter(Boolean).join('；'),note:H(r,/其他需求|備註/)})).filter(r=>r.unit||r.person);
  if(!recs.length){if(mode)return 0;toast('檔案裡沒有報名資料，請確認是「冠成尾牙 網站報名（回覆）」下載的檔案');return;}
  const agg=new Map();
  recs.forEach(r=>{const inv=findInv(r.unit||r.person);const key=inv?inv.id:'w'+ukey(r.unit||r.person).replace(/[^\w一-鿿]/g,'').slice(0,40);
    if(!agg.has(key))agg.set(key,{inv,recs:[]});agg.get(key).recs.push(r);});
  const changed=[];let matched=0,fresh=0;
  for(const [key,{inv,recs:rs}] of agg){
    const yes=rs.filter(r=>!/無法|不克|否/.test(r.attend));
    const names=yes.flatMap(r=>S_(r.names).split(/[，,、\n]/).map(S_).filter(Boolean));
    const count=yes.reduce((a,r)=>a+(parseInt(r.count,10)||0),0)||names.length;
    const base=inv?clone(inv):(INV.get(key)?clone(INV.get(key)):{id:key,unit:rs[0].unit||rs[0].person,contact:'',group:'網站新報名',channel:'網站',addr:'',fax:'',lyCount:null,lyNames:'',lyNote:CAT2G[rs[0].cat]?`報名類別：${rs[0].cat}`:'',lyGift:'',bossNote:'',reminders:[],merge:'',src:'網站新報名'});
    const next={...base,boss:'yes',sent:true,sentAt:base.sentAt||today(),reply:yes.length?'yes':'no',count:yes.length?count:0,names:names.join('，'),veg:vegCount(names.join(' '))+(yes.reduce((a,r)=>a+(/（素）|\(素\)/.test(r.names)?0:(parseInt(r.veg,10)||0)),0)),
      note:[...new Set(rs.map(r=>r.note).filter(Boolean))].join('；')||base.note||'',webGift:[...new Set(rs.map(r=>r.gift).filter(Boolean))].join('；'),contact:base.contact||[rs[0].person,rs[0].title].filter(Boolean).join(' '),brand:rs.map(r=>r.brand).find(Boolean)||base.brand||'',src:inv?'網站報名':'網站新報名'};
    if(!inv&&!INV.get(key))fresh++;else matched++;
    const cmp=o=>JSON.stringify([o.boss,o.sent,o.reply,o.count,o.names,o.veg,o.note,o.webGift,o.contact,o.brand||'']);
    if(!INV.get(next.id)||cmp(INV.get(next.id))!==cmp(next))changed.push(next);
  }
  if(mode==='count')return changed.length;
  if(!changed.length){toast('網站報名沒有新的變化，名冊已經是最新的');return;}
  const splitN=v=>S_(v).split(/[，,、\n]/).map(S_).filter(Boolean);
  const desc=x=>{const o=INV.get(x.id);const st=x.reply==='yes'?`出席 ${x.count} 人`:'不克出席';
    if(!o)return{k:'new',t:`${st}（名單外，加到「網站新報名」）`};
    if(!o.reply)return{k:'first',t:`第一次回覆：${st}`};
    const parts=[];
    if(o.reply!==x.reply)parts.push(x.reply==='yes'?'改為出席':'改為不克出席');
    if(x.reply==='yes'&&Number(o.count)!==Number(x.count))parts.push(`人數 ${o.count||0} → ${x.count}`);
    const a=new Set(splitN(o.names)),b2=new Set(splitN(x.names));
    const add=[...b2].filter(n=>!a.has(n)),del=[...a].filter(n=>!b2.has(n));
    if(add.length)parts.push('新增 '+add.join('、'));if(del.length)parts.push('移除 '+del.join('、'));
    if(Number(o.veg||0)!==Number(x.veg||0))parts.push(`素食 ${o.veg||0} → ${x.veg||0}`);
    if(S_(o.note)!==S_(x.note)&&x.note)parts.push('備註：'+x.note);
    return{k:'upd',t:parts.join('；')||'聯絡資料更新',manual:o.src&&o.src!=='網站報名'&&o.src!=='網站新報名'&&!!o.reply};};
  const ds=changed.map(x=>({x,...desc(x)}));
  const sec=(k,title)=>{const l=ds.filter(d=>d.k===k);return l.length?`<div><b style="font-size:16px">${title}（${l.length}）</b><ul class="muted" style="margin:4px 0 0;padding-left:18px">${l.map(d=>`<li><b style="color:var(--ink)">${esc(d.x.unit)}</b>：${esc(d.t)}${d.manual?' <span style="color:var(--warn)">⚠ 會取代你手動登記的回覆</span>':''}</li>`).join('')}</ul></div>`:'';};
  openDlg(`<h3>匯入網站報名</h3><p class="sub">讀到 ${recs.length} 筆網站報名，有 <b>${changed.length}</b> 個單位要更新，其他單位沒有變化。</p>
    ${sec('upd','名單有變動')}${sec('first','新回覆')}${sec('new','名單外的新報名')}
    <div class="acts" style="display:flex;gap:8px"><button id="dCancel">取消</button><button class="primary" id="dOk">確定更新</button></div>`);
  $('dCancel').onclick=closeDlg;
  $('dOk').onclick=async()=>{const b=$('dOk');b.disabled=true;b.textContent='更新中…';const n=await saveMany(changed);closeDlg();toast(`已更新 ${n} 個單位`);};
}

$('bXlsx').onclick=()=>{const L={boss:'待老闆確認',skip:'不邀請',send:'待發送',wait:'等回覆',replied:'已回覆'};
  const rows=[...INV.values()].sort((a,b)=>(GROUPS.indexOf(a.group)+99)%99-(GROUPS.indexOf(b.group)+99)%99||a.id.localeCompare(b.id)).map(i=>({'分類':i.group,'單位':i.unit,'邀請對象':i.contact,'邀請方式':i.channel,'地址／電話':[i.addr,i.fax].filter(Boolean).join(' '),'老闆確認':i.boss==='yes'?'邀請':i.boss==='no'?'不邀':'待確認','進度':L[stage(i)],'發送日':i.sentAt||'','催回覆':(i.reminders||[]).join('、'),'回覆':i.merge?'併入 '+i.merge:i.reply==='yes'?'出席':i.reply==='no'?'不克出席':'','人數':i.reply==='yes'?i.count:'','名單':i.names||'','素食':i.veg||'','不吃牛':(S_(i.names).match(/不吃牛/g)||[]).length||'','兒童椅':(S_(i.names).match(/兒童椅/g)||[]).length||'','備註':i.note||'','去年紀錄':lyText(i)}));
  const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[8,22,26,8,30,9,10,10,14,9,6,40,6,7,7,24,36].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'邀請追蹤');
  offer('冠成尾牙_邀請追蹤表.xlsx',new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'})));};

// ---------- events ----------
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.filt){filt=(t.dataset.filt===filt)?'all':t.dataset.filt;render();return;}
  if(t.dataset.fg!==undefined){fgSel=t.dataset.fg;render();return;}
  const id=t.dataset.boss||t.dataset.sent||t.dataset.reply||t.dataset.edit||t.dataset.msg;const i=id&&INV.get(id);
  if(t.dataset.boss&&i){const x=clone(i);x.boss=t.dataset.v;x._justDecided=bossOpen;await save(x);if(bossOpen){INV.get(x.id)._justDecided=true;renderBoss();}return;}
  if(t.dataset.bossall){const g=t.dataset.bossall;const list=[...INV.values()].filter(i=>i.group===g&&stage(i)==='boss').map(i=>({...clone(i),boss:'yes'}));
    const n=await saveMany(list);list.forEach(x=>{const y=INV.get(x.id);if(y)y._justDecided=true;});renderBoss();toast(`${g}：${n} 筆設為邀請`);return;}
  if(t.dataset.sent&&i){const x=clone(i);x.sent=true;x.sentAt=today();await save(x);toast(`${i.unit} 已標記發送，移到「等回覆」`);return;}
  if(t.dataset.reply&&i){replyDlg(i);return;}
  if(t.dataset.edit&&i){editDlg(i);return;}
  if(t.dataset.msg&&i){msgDlg(i,t.dataset.k);return;}
});
$('q').addEventListener('input',render);
const setVM=v=>{viewMode=v;try{localStorage.setItem('kc-inv-view',v);}catch(_){}render();};$('vTable').onclick=()=>setVM('table');$('vCard').onclick=()=>setVM('card');
$('bBoss').onclick=()=>{bossOpen=true;$('boss').hidden=false;renderBoss();};
$('bAdd').onclick=()=>editDlg(null);
$('bPrintA').onclick=printDlg;
$('bSet').onclick=setDlg;
async function webRows(){const j=await window.__kcCall({op:'web'});return j.rows||[];}
$('bWeb').onclick=async()=>{const b=$('bWeb');b.disabled=true;const t=b.textContent;b.textContent='讀取網站報名中…';
  try{await importRows(await webRows());}catch(_){toast('讀不到網站報名資料，請稍後再試');}finally{b.disabled=false;b.textContent='同步網站報名';}};
let webChecked=false;async function checkWeb(){if(webChecked||!live||!INV.size)return;webChecked=true;
  try{const n=await importRows(await webRows(),'count');if(n){$('bWeb').textContent=`同步網站報名（${n} 筆有變動）`;$('bWeb').classList.add('primary');}}catch(_){}}
setInterval(()=>{webChecked=false;},300000);
$('fWeb').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importWeb(f);};

// ---------- boot ----------
render();
(async()=>{
  try{dl=await claude.use('downloads');}catch(_){}
  try{sample=await claude.use('sample');}catch(_){}
  let user=null;try{user=await claude.use('user');}catch(_){}
  if(user){const c=await user.can('data.write');if(c===false){canWrite=false;$('roBanner').hidden=false;}}
  try{db=await claude.use('db');}catch(_){db=null;}
  if(!db){$('noDb').hidden=false;live=true;render();return;}
  db.collection('invites').onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>{const old=INV.get(d.id);m.set(d.id,{...d.data(),id:d.id,...(old&&old._justDecided?{_justDecided:true}:{})});});INV=m;live=true;render();checkWeb();},
    e=>{toast('資料連線中斷，請重新整理頁面');});
  db.doc('config/event').onSnapshot(s=>{CFG={...DEF_CFG,...(s.exists?s.data():{})};},()=>{});
})();
})();
</script>

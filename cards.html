<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.__KC_PREFIXES=['flow/','config/','invites/'];</script><script>/* Stand-in for the Claude page runtime: the same claude.use('db') / ('downloads') calls,
   backed by the 冠成 Apps Script + Google Sheet, with a shared passcode. */
(()=>{
const API='https://script.google.com/macros/s/AKfycbx4J4jwRwaeZ1l8qbJXbwGf486TUU8jgg4FR1YHfr9CZgAne3XlDPVl-ayJx8q2mGw/exec';
const PREFIXES=window.__KC_PREFIXES||null;
const KEYK='kc37-passcode';
let key=null;try{key=localStorage.getItem(KEYK);}catch(_){}
async function call(body,tries=0){
  let r;try{r=await fetch(API,{method:'POST',body:JSON.stringify({...body,key})});}
  catch(e){if(tries<2){await new Promise(s=>setTimeout(s,1200*(tries+1)));return call(body,tries+1);}const x=new Error('network');x.code='unavailable';throw x;}
  let j;try{j=await r.json();}catch(_){const x=new Error('bad response');x.code='unavailable';throw x;}
  if(!j.ok){const x=new Error(j.error||'error');x.code=j.error==='bad_key'?'invalid_argument':'unavailable';x.badKey=j.error==='bad_key';throw x;}
  return j;
}
window.__kcCall=call;

// ---------- passcode gate ----------
let readyRes;const ready=new Promise(r=>readyRes=r);
function gate(msg){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;z-index:99;display:grid;place-items:center;padding:16px;background:rgba(30,10,12,.72)';
  d.innerHTML=`<form style="background:#FFFDF9;color:#2E2622;border-radius:18px;border-top:4px solid #7A1520;padding:26px 24px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;box-shadow:0 24px 70px rgba(0,0,0,.4)">
    <div style="font-family:'Noto Serif TC',serif;font-size:22px;font-weight:900;letter-spacing:.06em">請輸入通關密碼</div>
    <div style="font-size:15px;color:#5C514A">冠成尾牙內部使用，密碼請向負責同仁索取。這台裝置輸入一次就會記住。</div>
    <input id="kcPass" autocomplete="current-password" type="password" style="font:inherit;font-size:18px;padding:10px 12px;border:1px solid #D9BF8A;border-radius:10px" aria-label="通關密碼">
    <div id="kcErr" style="color:#B5541B;font-size:14px;min-height:1em">${msg||''}</div>
    <button style="font:inherit;font-size:17px;font-weight:700;padding:10px;border:none;border-radius:999px;background:#7A1520;color:#F6E7C8;cursor:pointer">進入</button></form>`;
  document.body.appendChild(d);const f=d.querySelector('form');setTimeout(()=>d.querySelector('input').focus(),0);
  f.onsubmit=async e=>{e.preventDefault();const v=d.querySelector('input').value.trim();if(!v)return;key=v;d.querySelector('#kcErr').textContent='確認中…';
    try{await call({op:'list',since:Date.now()+86400000});try{localStorage.setItem(KEYK,key);}catch(_){}d.remove();readyRes();}
    catch(err){d.querySelector('#kcErr').textContent=err.badKey?'密碼不對，請再確認一次。':'連不上伺服器，請檢查網路後再試。';}};
}
async function start(){
  if(key){try{await call({op:'list',since:Date.now()+86400000});readyRes();return;}catch(e){if(!e.badKey){readyRes();return;}}}
  gate(key?'密碼已變更，請重新輸入。':'');
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
window.kcLogout=()=>{try{localStorage.removeItem(KEYK);}catch(_){}location.reload();};

// ---------- document store with polling ----------
const cache=new Map();           // "coll/id" -> data
const colL=new Map(),docL=new Map();
const pend=new Map();            // key -> {json, waiters:[]}
const inflight=new Set();
let since=0,firstDone=false,firstRes;const first=new Promise(r=>firstRes=r);
const depth=p=>p.split('/').length;
const snapOf=(id,v)=>({id,exists:v!==undefined,data:()=>v,metadata:{fromCache:false,hasPendingWrites:false}});
function colSnap(c){const docs=[];cache.forEach((v,k)=>{if(k.startsWith(c+'/')&&depth(k)===depth(c)+1)docs.push(snapOf(k.slice(c.length+1),v));});
  docs.sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};}
function emit(keys){const cs=new Set(),ds=new Set();keys.forEach(k=>{ds.add(k);cs.add(k.slice(0,k.lastIndexOf('/')));});
  cs.forEach(c=>(colL.get(c)||[]).forEach(fn=>{try{fn(colSnap(c));}catch(e){console.error(e);}}));
  ds.forEach(d=>(docL.get(d)||[]).forEach(fn=>{try{fn(snapOf(d.split('/').pop(),cache.get(d)));}catch(e){console.error(e);}}));}
async function poll(){
  try{const j=await call({op:'list',since,prefixes:PREFIXES});
    const ch=[];
    j.docs.forEach(d=>{if(pend.has(d.k)||inflight.has(d.k))return;
      if(d.del){if(cache.has(d.k)){cache.delete(d.k);ch.push(d.k);}}
      else{const cur=cache.get(d.k);if(cur===undefined||JSON.stringify(cur)!==d.json){try{cache.set(d.k,JSON.parse(d.json));ch.push(d.k);}catch(_){}}}});
    since=j.now-4000;
    if(!firstDone){firstDone=true;firstRes();colL.forEach((fns,c)=>fns.forEach(fn=>fn(colSnap(c))));docL.forEach((fns,d)=>fns.forEach(fn=>fn(snapOf(d.split('/').pop(),cache.get(d)))));}
    else if(ch.length)emit(ch);
    setStatus('');
  }catch(e){if(e.badKey){gate('密碼已變更，請重新輸入。');return;}setStatus('offline');}
  setTimeout(poll,document.hidden?30000:6000);
}
ready.then(poll);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&firstDone)poll();});
let flushT=null;
function queue(k,json){return new Promise((res,rej)=>{const p=pend.get(k)||{waiters:[]};p.json=json;p.waiters.push({res,rej});pend.set(k,p);clearTimeout(flushT);flushT=setTimeout(flush,250);});}
async function flush(){if(!pend.size)return;const items=[...pend.entries()].slice(0,150);items.forEach(([k])=>{pend.delete(k);inflight.add(k);});
  try{await call({op:'write',writes:items.map(([k,p])=>({k,json:p.json}))});items.forEach(([,p])=>p.waiters.forEach(w=>w.res()));}
  catch(e){items.forEach(([k,p])=>p.waiters.forEach(w=>w.rej(e)));}
  finally{items.forEach(([k])=>inflight.delete(k));if(pend.size)flush();}}
function setOne(k,data){const d=JSON.parse(JSON.stringify(data));cache.set(k,d);emit([k]);return queue(k,JSON.stringify(d));}
function delOne(k){cache.delete(k);emit([k]);return queue(k,null);}
function docRef(path){return{id:path.split('/').pop(),path,
  set:d=>setOne(path,d),
  update:d=>setOne(path,{...(cache.get(path)||{}),...d}),
  delete:()=>delOne(path),
  get:async()=>{await first;return snapOf(path.split('/').pop(),cache.get(path));},
  onSnapshot:(fn)=>{if(!docL.has(path))docL.set(path,[]);docL.get(path).push(fn);if(firstDone)setTimeout(()=>fn(snapOf(path.split('/').pop(),cache.get(path))),0);return()=>{const a=docL.get(path);a.splice(a.indexOf(fn),1);};},
  collection:c=>colRef(path+'/'+c)};}
function colRef(c){return{path:c,doc:id=>docRef(c+'/'+(id||Math.random().toString(36).slice(2,12))),
  add:async d=>{const r=docRef(c+'/'+Math.random().toString(36).slice(2,12));await r.set(d);return r;},
  get:async()=>{await first;return colSnap(c);},
  onSnapshot:(fn)=>{if(!colL.has(c))colL.set(c,[]);colL.get(c).push(fn);if(firstDone)setTimeout(()=>fn(colSnap(c)),0);return()=>{const a=colL.get(c);a.splice(a.indexOf(fn),1);};}};}
const db={doc:docRef,collection:colRef};
window.addEventListener('beforeunload',e=>{if(pend.size||inflight.size){e.preventDefault();e.returnValue='';}});

// ---------- connection badge ----------
let badge=null;
function setStatus(s){if(!badge){badge=document.createElement('div');badge.style.cssText='position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;background:#B5541B;color:#fff;border-radius:999px;padding:6px 14px;font:600 14px "Noto Sans TC",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)';badge.hidden=true;document.body.appendChild(badge);}
  badge.hidden=!s;badge.textContent='⚠️ 網路中斷，恢復後會自動同步';}

// ---------- downloads ----------
const downloads={save:async({filename,data})=>{
  const type=/\.html?$/i.test(filename)?'text/html;charset=utf-8':/\.xlsx$/i.test(filename)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':/\.json$/i.test(filename)?'application/json':/\.jpe?g$/i.test(filename)?'image/jpeg':'application/octet-stream';
  const blob=data instanceof Blob?data:new Blob([data],{type});const url=URL.createObjectURL(blob);
  if(/\.html?$/i.test(filename)){const w=window.open(url,'_blank');if(w){setTimeout(()=>URL.revokeObjectURL(url),60000);return;}}
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}};

// ---------- back to top ----------
function topBtn(){const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','回到最上面');b.title='回到最上面';
  b.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span style="font-size:12px;font-weight:700;line-height:1">頂部</span>';
  b.style.cssText='position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;width:60px;height:60px;border-radius:50%;border:none;background:#7A1520;color:#F6E7C8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 8px 24px rgba(78,11,19,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;transform:translateY(8px);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif';
  b.onclick=()=>window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  document.body.appendChild(b);
  const upd=()=>{const on=window.scrollY>500;b.style.opacity=on?'1':'0';b.style.pointerEvents=on?'auto':'none';b.style.transform=on?'none':'translateY(8px)';};
  window.addEventListener('scroll',upd,{passive:true});upd();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',topBtn);else topBtn();

window.claude={use:async n=>{if(n==='db'){await ready;return db;}if(n==='downloads')return downloads;return null;}};
})();
</script></head><body><title>冠成尾牙紙本邀請卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>

}

  --ok:#6CC08F; --ok-pale:#1F3328; --warn:#F09A62; --warn-pale:#3B2619; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}

button,.btn{font:inherit;font-size:15.5px;border:1px solid var(--hair);background:var(--sheet);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:42px}

td textarea,td input[type=number],td select{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid transparent;border-radius:8px;padding:5px 7px;width:100%}
td textarea:hover,td input[type=number]:hover,td select:hover{border-color:var(--hair)}

.lk.warn{color:var(--warn);text-decoration:none;cursor:default}.lk.warn .lk{margin-left:4px;color:var(--warn)}
.lk.ok{color:var(--ok);text-decoration:none;cursor:default}
.ovl{position:fixed;inset:0;background:rgba(30,10,12,.5);display:grid;place-items:center;z-index:80;padding:16px}
.ld{background:var(--sheet);border-radius:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ld input{font:inherit;padding:8px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--paper);color:var(--ink)}
.ld .it{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--hair);padding:8px 2px}

th:nth-child(2){min-width:150px}th:nth-child(3){min-width:190px}th:nth-child(7){min-width:170px}

</style>

<header class="top"><div class="in">

<main>
  <div class="kpis" id="kpis"></div>
  <div class="note" id="need"></div>

  <section>
    <h3>名單<small>政商、教育界、各廠牌高層（只邀請、不贊助）。直接在表格裡改，會自動存檔，大家看得到。</small></h3>

const GR=['政商','教育界','廠牌高層','其他'],HOW=['郵寄','轉交','親送','給本人'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
let C=null,DB=null,tab='all',saveT=null,INV=new Map(),invReady=false,linked=false;
function save(){if(!DB)return;clearTimeout(saveT);saveT=setTimeout(async()=>{try{await DB.doc('flow/cards').set(C);}catch(_){toast('存檔失敗，請檢查網路');}finally{saveT=null;}},400);}
// 今年是否邀請：'' 待討論、'邀請'、'不邀'；張數、標籤、寄送清單都不算「不邀」
// 連到邀請名冊的卡片：要不要邀請、是否已發出，都以名冊為準（在名冊按不邀，這裡就自動不寄）
const invOf=x=>x.inv?INV.get(x.inv):null;
const B2D={yes:'邀請',no:'不邀'};
const dec=x=>{const i=invOf(x);return i?(B2D[i.boss]||''):(x.decide||'');};
// 名冊把邀請方式改成 LINE 等非紙本 → 不寄紙本卡
const isPaperCh=c=>!c||/紙本|親送/.test(c);
const paperOK=x=>{const i=invOf(x);return !i||isPaperCh(i.channel);};
const live=x=>dec(x)!=='不邀'&&paperOK(x);
const nrm=t=>String(t||'').replace(/[\s　]/g,'').replace(/股份有限公司|有限公司|公司/g,'').replace(/[（(].*?[)）]/g,'');
const share=(a,b)=>{a=nrm(a);b=nrm(b);for(let k=0;k+2<=a.length;k++)if(b.includes(a.slice(k,k+2)))return true;return false;};
function autoLink(){if(!C||!invReady)return;let ch=false;const used=new Set(C.list.map(x=>x.inv).filter(Boolean));
  const SG=['政商','教育界','廠牌高層'];
  // 自動配對只在同一分類裡找（廠牌高層不會配到廠商）；手動連結的不動
  C.list.forEach(x=>{const i=x.inv&&INV.get(x.inv);if(x.inv&&(!i||(!x.manual&&SG.includes(x.group)&&i.group!==x.group))){used.delete(x.inv);delete x.inv;ch=true;}});
  C.list.forEach(x=>{if(x.inv||x.noLink)return;const u=nrm(x.unit);if(u.length<2)return;
    const pool=[...INV.values()].filter(i=>!used.has(i.id)&&(!SG.includes(x.group)||i.group===x.group));
    let c=pool.filter(i=>nrm(i.unit)===u);
    if(!c.length)c=pool.filter(i=>(nrm(i.unit).includes(u)||u.includes(nrm(i.unit)))&&nrm(i.unit).length>=2);
    if(c.length>1&&x.person)c=c.filter(i=>share(x.person,i.contact)||share(x.person,i.vip||i.lyNote));
    if(c.length===1){x.inv=c[0].id;used.add(c[0].id);ch=true;}});
  // 名冊裡選「紙本」但這裡還沒有的，自動加進來
  const G={'政商':'政商','教育界':'教育界','廠牌高層':'廠牌高層'};
  [...INV.values()].filter(i=>i.channel&&isPaperCh(i.channel)&&!used.has(i.id)).forEach(i=>{C.list.push({id:'r'+i.id,inv:i.id,group:G[i.group]||'其他',unit:i.unit,person:i.contact||'',addr:i.addr||'',ly:i.lyCount??'',note:'',how:/親送/.test(i.channel)?'親送':i.addr?'郵寄':'親送',sent:!!i.sent,sentAt:'',fromRoster:true});used.add(i.id);ch=true;});
  if(ch)save();}
async function setInv(i,patch){const x={...i,...patch,updatedAt:Date.now()};INV.set(x.id,x);render();try{await DB.collection('invites').doc(x.id).set(x);}catch(_){toast('名冊沒有存到，請檢查網路');}}
function render(){if(!C)return;const ALL=C.list,L=ALL.filter(live);
  const sent=L.filter(x=>x.sent).length,ly=L.reduce((a,x)=>a+(Number(x.ly)||0),0);
  const by=h=>L.filter(x=>x.how===h).length;const nP=ALL.filter(x=>!paperOK(x)).length,nW=ALL.filter(x=>!dec(x)&&paperOK(x)).length,nY=ALL.filter(x=>dec(x)==='邀請').length,nN=ALL.filter(x=>dec(x)==='不邀').length;
  $('kpis').innerHTML=[[nW,'待討論',nW?'warn':'ok'],[nY,'確定邀請','ok'],[nN,'不邀'],...(nP?[[nP,'名冊改成 LINE 等']]:[]),[L.length,'紙本卡張數','gold'],[L.length-sent,'還沒寄出',L.length-sent?'warn':'ok'],[sent,'已寄出','ok'],[by('郵寄'),'郵寄'],[ly,'去年出席人數']]
    .map(([v,l,c])=>`<div class="kpi ${c||''}"><b>${v}</b><span>${l}</span></div>`).join('');
  const nMail=by('郵寄');
  $('need').innerHTML=(nW?`還有 <b>${nW}</b> 筆待討論，可以按「列印討論清單」帶去跟老闆勾選。`:'')+`扣掉不邀的，共需 <b>${L.length}</b> 張紙本邀請卡（郵寄 ${nMail} 張需要信封標籤）。到大中華領 <b>80</b> 份，寄完還有 <b>${80-L.length}</b> 份備用。`;
  $('tabs').innerHTML=[['all','全部 '+ALL.length],['wait','待討論 '+nW]].concat(nP?[['np','名冊不是紙本 '+nP]]:[]).concat(GR.map(g=>[g,g+' '+ALL.filter(x=>x.group===g).length])).map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${esc(l)}</button>`).join('');
  let n=0;
  $('tb').innerHTML=GR.filter(g=>tab==='all'||tab==='wait'||tab==='np'||tab===g).map(g=>{const its=ALL.filter(x=>x.group===g&&(tab!=='wait'||(!dec(x)&&paperOK(x)))&&(tab!=='np'||!paperOK(x)));if(!its.length)return'';
    return `<tr class="grp"><td colspan="10">${g}　<span style="font-family:var(--body);font-size:14px;color:var(--muted);font-weight:500">${its.length} 張</span></td></tr>`+its.map(x=>{n++;const d=dec(x);return `<tr data-id="${x.id}" class="${x.sent?'sent':''} ${d==='不邀'||!paperOK(x)?'off':''}">
      <td class="no">${n}</td>
      <td><select data-f="decide" class="dec ${d==='邀請'?'d-yes':d==='不邀'?'d-no':'d-wait'}" aria-label="今年是否邀請"><option value="" ${!d?'selected':''}>待討論</option><option ${d==='邀請'?'selected':''}>邀請</option><option ${d==='不邀'?'selected':''}>不邀</option></select></td>
      <td class="u"><textarea rows="1" data-f="unit" aria-label="單位">${esc(x.unit)}</textarea>${invOf(x)?(paperOK(x)?`<div class="lk ok" title="要不要邀請以邀請名冊為準">🔗 名冊：${esc(invOf(x).unit)}${invOf(x).channel&&invOf(x).channel!=='紙本'?`（${esc(invOf(x).channel)}）`:''}</div>`:`<div class="lk warn">🔗 名冊改成「${esc(invOf(x).channel)}」，不寄紙本 <button class="lk" data-paper="${x.id}" data-ch="紙本">改回紙本</button><button class="lk" data-paper="${x.id}" data-ch="${/LINE/.test(invOf(x).channel)?'LINE＋紙本卡':'紙本'}">${/LINE/.test(invOf(x).channel)?'LINE 也要寄卡':''}</button></div>`):`<button class="lk" data-link="${x.id}">未連到名冊・連結</button>`}</td>
      <td><textarea rows="1" data-f="person" aria-label="收件人">${esc(x.person)}</textarea></td>
      <td><select data-f="how" aria-label="寄送方式">${HOW.map(h=>`<option ${h===x.how?'selected':''}>${h}</option>`).join('')}</select></td>
      <td class="a"><textarea rows="1" data-f="addr" placeholder="${x.how==='郵寄'?'郵遞區號＋地址':x.how==='轉交'?'轉交給誰':''}" aria-label="地址">${esc(x.addr)}</textarea></td>
      <td><input type="number" min="0" data-f="ly" value="${esc(x.ly)}" aria-label="去年人數"></td>
      <td><textarea rows="1" data-f="note" aria-label="備註">${esc(x.note)}</textarea></td>
      <td class="sc"><input type="checkbox" data-f="sent" ${x.sent?'checked':''} aria-label="已寄出">${x.sentAt?`<div class="d">${esc(x.sentAt)}</div>`:''}</td>
      <td><button class="del" data-del="${x.id}">刪除</button></td></tr>`;}).join('');}).join('')||'<tr><td colspan="10" class="empty">沒有資料</td></tr>';
  growAll();
}
const grow=a=>{a.style.height='auto';a.style.height=a.scrollHeight+'px';};
const growAll=()=>document.querySelectorAll('#tb textarea').forEach(grow);
document.addEventListener('input',e=>{if(e.target.matches('#tb textarea'))grow(e.target);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#tb textarea')){e.preventDefault();e.target.blur();}});
addEventListener('resize',()=>growAll());
document.addEventListener('change',e=>{const tr=e.target.closest('tr[data-id]');if(!tr||!C)return;const x=C.list.find(y=>y.id===tr.dataset.id);const f=e.target.dataset.f;if(!x||!f)return;
  if(f==='decide'&&invOf(x)){const v=e.target.value;setInv(invOf(x),{boss:v==='邀請'?'yes':v==='不邀'?'no':'pending'});toast(`已同步到邀請名冊：${x.unit} ${v||'待討論'}`);return;}
  if(f==='sent'){x.sent=e.target.checked;x.sentAt=x.sent?new Date().toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'})+' 寄出':'';
    const i=invOf(x);if(i&&x.sent&&!i.sent){const d=new Date(),p=n=>String(n).padStart(2,'0');setInv(i,{sent:true,sentAt:`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`});}}
  else if(f==='ly')x.ly=e.target.value===''?'':Number(e.target.value);
  else x[f]=e.target.value.replace(/\s*\n\s*/g,' ').trim();
  render();save();});
function linkDlg(x){const o=document.createElement('div');o.className='ovl';o.innerHTML=`<div class="ld" role="dialog" aria-modal="true"><b style="font-size:18px">把「${esc(x.unit)}」連到邀請名冊</b><span style="color:var(--muted);font-size:14px">連結後，在名冊按邀請／不邀，這裡會自動跟著改。</span><input id="lq" placeholder="搜尋名冊的單位或人名" value="${esc(nrm(x.unit).slice(0,4))}"><div id="ll"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button id="lNo">名冊沒有這筆（不連結）</button><button id="lC">取消</button></div></div>`;document.body.appendChild(o);
  const draw=()=>{const q=nrm($('lq').value);const used=new Set(C.list.map(y=>y.inv).filter(Boolean));const L=[...INV.values()].filter(i=>!q||nrm(i.unit+i.contact).includes(q)).slice(0,30);
    $('ll').innerHTML=L.map(i=>`<div class="it"><span><b>${esc(i.unit)}</b> <span style="color:var(--muted);font-size:13.5px">${esc(i.group)}・${esc(i.contact||'')}・${esc(i.channel||'')}${used.has(i.id)?'・已被連結':''}</span></span><button data-pick="${i.id}">連結</button></div>`).join('')||'<div style="color:var(--muted)">找不到，換個關鍵字</div>';};
  draw();$('lq').oninput=draw;$('lq').focus();const close=()=>o.remove();$('lC').onclick=close;o.onclick=e=>{if(e.target===o)close();};
  $('lNo').onclick=()=>{x.noLink=true;delete x.inv;close();render();save();};
  $('ll').onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;C.list.forEach(y=>{if(y.inv===b.dataset.pick)delete y.inv;});x.inv=b.dataset.pick;x.manual=true;delete x.noLink;close();render();save();toast('已連結，邀請與否以名冊為準');};}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.paper){const x=C&&C.list.find(y=>y.id===t.dataset.paper);const i=x&&invOf(x);if(i){const ch=t.dataset.ch||'紙本';setInv(i,{channel:ch});toast(`${i.unit} 的邀請方式改成「${ch}」，會寄紙本卡`);}return;}
  if(t.dataset.link){const x=C&&C.list.find(y=>y.id===t.dataset.link);if(x)linkDlg(x);return;}
  if(t.dataset.tab){tab=t.dataset.tab;render();return;}
  if(t.dataset.del){if(!t.dataset.arm){t.dataset.arm=1;t.textContent='確定刪除？';return;}C.list=C.list.filter(y=>y.id!==t.dataset.del);render();save();return;}});
$('addBtn').onclick=()=>{if(!C)return;const g=tab==='all'?'政商':tab;C.list.push({id:'c'+Date.now().toString(36),group:g,unit:'',person:'',addr:'',ly:'',note:'',how:'郵寄'});
  const L=C.list;const last=L.pop();const k=L.map(x=>x.group).lastIndexOf(g);L.splice(k+1,0,last);render();save();
  setTimeout(()=>{const r=document.querySelector(`tr[data-id="${last.id}"] input`);r&&r.focus();},50);};

// ---------- print ----------
function openPrint(title,body,css){const w=window.open('','_blank');if(!w){toast('請允許彈出視窗');return;}
  w.document.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${title}</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#1d1714;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;background:#7A1520;color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:5}.bar button{font:inherit;font-weight:700;padding:6px 20px;border:none;border-radius:999px;background:#fff;color:#7A1520;cursor:pointer}
  @media print{.bar{display:none}}${css}</style></head><body>${body}</body></html>`);w.document.close();}
$('pTalk').onclick=()=>{if(!C)return;let n=0;const TL=C.list.filter(paperOK);const date=new Date().toLocaleDateString('zh-TW');const box=v=>v?'☑':'☐';
  const body=`<div class="bar"><span>紙本邀請卡　今年邀請討論清單（${TL.length} 筆）</span><button onclick="print()">列印</button><span style="opacity:.85;font-size:12.5px">A4 直向</span></div><main>
  <h1>冠成家電尾牙　紙本邀請卡　今年邀請討論清單</h1><div class="r">共 ${TL.length} 筆・已勾的是目前的決定・列印日期：${date}</div>
  ${GR.map(g=>{const its=TL.filter(x=>x.group===g);if(!its.length)return'';return `<h2>${g}<span>${its.length} 筆</span></h2><table><thead><tr><th class="no">#</th><th>單位</th><th>收件人</th><th class="c">去年<br>人數</th><th>備註</th><th class="c">邀請</th><th class="c">不邀</th></tr></thead><tbody>${its.map(x=>{n++;const d=dec(x);return `<tr><td class="no">${n}</td><td><b>${esc(x.unit)}</b></td><td>${esc(x.person)}</td><td class="c">${x.ly===''||x.ly==null?'—':esc(x.ly)}</td><td>${esc(x.note)}</td><td class="c b">${box(d==='邀請')}</td><td class="c b">${box(d==='不邀')}</td></tr>`;}).join('')}</tbody></table>`;}).join('')}</main>`;
  openPrint('紙本邀請卡討論清單',body,`@page{size:A4 portrait;margin:10mm}@media screen{body{background:#e9e4dc}main{background:#fff;max-width:210mm;margin:14px auto;padding:10mm}}
  h1{font-size:17pt;color:#7A1520;letter-spacing:.08em;margin:0}.r{color:#5C514A;font-size:10.5pt;margin:1mm 0 3mm;border-bottom:2pt double #A8843F;padding-bottom:2mm}
  h2{font-size:13pt;color:#7A1520;margin:4mm 0 1.5mm;break-after:avoid}h2 span{font-size:10pt;color:#8C7F74;margin-left:3mm;font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:10.5pt;table-layout:fixed}thead{display:table-header-group}tr{break-inside:avoid}
  th{background:#F4E7CB;color:#4E0B13;text-align:left;padding:1.2mm 1.6mm;border:.5pt solid #D9BF8A;font-size:9.5pt}td{border:.5pt solid #DCCFBE;padding:1.6mm 1.6mm;vertical-align:top;overflow-wrap:anywhere}
  .no{width:8mm;text-align:center;color:#8C7F74}.c{width:12mm;text-align:center}.b{font-size:15pt;line-height:1}th:nth-child(2){width:44mm}th:nth-child(3){width:50mm}`);};
$('pList').onclick=()=>{if(!C)return;let n=0;const LL=C.list.filter(live);const date=new Date().toLocaleDateString('zh-TW');
  const body=`<div class="bar"><span>紙本邀請卡寄送清單（${LL.length} 張）</span><button onclick="print()">列印</button><span style="opacity:.85;font-size:12.5px">A4 直向</span></div><main>
  <h1>冠成家電尾牙　紙本邀請卡寄送清單</h1><div class="r">共 ${LL.length} 張（不含不邀）・列印日期：${date}</div>
  ${GR.map(g=>{const its=LL.filter(x=>x.group===g);if(!its.length)return'';return `<h2>${g}<span>${its.length} 張</span></h2><table><thead><tr><th class="no">#</th><th>單位／收件人</th><th class="h">方式</th><th>地址／轉交</th><th class="c">去年<br>人數</th><th>備註</th><th class="c">已寄</th></tr></thead><tbody>${its.map(x=>{n++;return `<tr><td class="no">${n}</td><td><b>${esc(x.unit)}</b> ${esc(x.person)}</td><td class="h">${esc(x.how)}</td><td>${esc(x.addr)}</td><td class="c">${x.ly===''||x.ly==null?'—':esc(x.ly)}</td><td>${esc(x.note)}</td><td class="c">${x.sent?'☑':'☐'}</td></tr>`;}).join('')}</tbody></table>`;}).join('')}</main>`;
  openPrint('紙本邀請卡寄送清單',body,`@page{size:A4 portrait;margin:10mm}@media screen{body{background:#e9e4dc}main{background:#fff;max-width:210mm;margin:14px auto;padding:10mm}}
  h1{font-size:18pt;color:#7A1520;letter-spacing:.1em;margin:0}.r{color:#5C514A;font-size:10.5pt;margin:1mm 0 3mm;border-bottom:2pt double #A8843F;padding-bottom:2mm}
  h2{font-size:13pt;color:#7A1520;margin:4mm 0 1.5mm;break-after:avoid}h2 span{font-size:10pt;color:#8C7F74;margin-left:3mm;font-weight:500}
  table{width:100%;border-collapse:collapse;font-size:10pt;table-layout:fixed}thead{display:table-header-group}tr{break-inside:avoid}
  th{background:#F4E7CB;color:#4E0B13;text-align:left;padding:1mm 1.4mm;border:.5pt solid #D9BF8A;font-size:9.5pt}td{border:.5pt solid #DCCFBE;padding:1mm 1.4mm;vertical-align:top;overflow-wrap:anywhere}
  .no{width:8mm;text-align:center;color:#8C7F74}.h{width:13mm}.c{width:11mm;text-align:center}th:nth-child(2){width:58mm}th:nth-child(4){width:52mm}`);};
let confirmLab=false;
$('pLabel').onclick=()=>{if(!C)return;const L=C.list.filter(x=>live(x)&&x.how==='郵寄'&&x.addr);if(!L.length){toast('沒有要郵寄的名單');return;}
  const nw=L.filter(x=>!dec(x)).length;if(nw&&!confirmLab){confirmLab=true;toast(`還有 ${nw} 張待討論的也會印出；確定要印再按一次`);setTimeout(()=>confirmLab=false,6000);return;}confirmLab=false;
  // same layout as the office's Word label template: «地址» / «單位» / «姓名» 先生/小姐 收 印刷品
  const titled=p=>/(長|理|委|代表|議員|任|監事|幹事|董事|總|師|官|員|人|主委)$/.test(p.replace(/暨全體同仁$/,''));
  const lab=x=>{const who=x.person||x.unit;const unit=x.person?x.unit:'';
    return `<div class="lb"><div>${esc(x.addr)}</div><div>${esc(unit)}</div><div>${esc(who)}　${titled(who)?'':'先生/小姐　'}收　印刷品</div></div>`;};
  const pages=[];for(let k=0;k<L.length;k+=16)pages.push(L.slice(k,k+16));
  const body=`<div class="bar"><span>信封標籤（${L.length} 張，A4 每頁 2×8＝16 格，同 Word 標籤格式）</span><button onclick="print()">列印</button><span style="opacity:.85;font-size:12.5px">A4 直向、邊界選「無」、縮放 100%</span></div>
   ${pages.map(p=>`<section class="pg">${p.map(lab).join('')}</section>`).join('')}
   <script>document.querySelectorAll('.lb').forEach(b=>{let f=13;while(b.scrollHeight>b.clientHeight+1&&f>9){f-=.5;b.style.fontSize=f+'pt';}});<\/script>`;
  openPrint('紙本邀請卡信封標籤',body,`@page{size:A4 portrait;margin:0}
  body{font-family:"新細明體","PMingLiU","MingLiU","Noto Serif TC",serif}
  .pg{width:210mm;height:297mm;padding:5mm 4mm 0;display:grid;grid-template-columns:repeat(2,102mm);grid-template-rows:repeat(8,36mm);break-after:page;overflow:hidden}
  .pg:last-child{break-after:auto}
  .lb{padding:6.5mm 1.9mm 0;font-size:13pt;line-height:1.3;overflow:hidden}
  .lb div{min-height:1.3em}
  @media screen{body{background:#e9e4dc}.pg{background:#fff;margin:14px auto;box-shadow:0 1px 6px rgba(0,0,0,.2)}.lb{outline:.2pt dashed #ddd}}`);};

(async()=>{const db=await claude.use('db');DB=db;
  db.collection('invites').onSnapshot(q=>{INV=new Map(q.docs.map(d=>[d.id,{...d.data(),id:d.id}]));invReady=true;autoLink();render();});
  db.doc('flow/cards').onSnapshot(s=>{if(saveT)return;
    if(s.exists&&s.data().list){C=s.data();autoLink();render();}
    else if(!C){C={list:SEED.map(x=>({...x,sent:false,sentAt:''}))};autoLink();render();save();}});
})();
})();
</script>
</body></html>
